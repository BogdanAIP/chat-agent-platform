name: Stage 4 Test Socket Fix

on:
  push:
    branches: [chat/stage4-yandex-relay]
    paths:
      - ".github/workflows/stage4-test-socket-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/stage4-yandex-relay
      - name: Restore accepted fake-gateway streams to blocking mode
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/agent-platform/tests/stage4_relay_lifecycle.rs")
          text = path.read_text(encoding="utf-8")
          old = '''                Ok((stream, _)) => stream,
          '''
          new = '''                Ok((stream, _)) => {
                      stream
                          .set_nonblocking(false)
                          .expect("accepted fake gateway stream blocking mode");
                      stream
                  }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one listener accept arm, got {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agent-platform/tests/stage4_relay_lifecycle.rs
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Fix fake gateway socket mode on Windows"
          git push origin HEAD:chat/stage4-yandex-relay
