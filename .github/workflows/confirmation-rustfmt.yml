name: Confirmation Rustfmt

on:
  push:
    branches: [chat/guarded-confirmation-protocol]
    paths:
      - ".github/workflows/confirmation-rustfmt.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/guarded-confirmation-protocol
      - name: Apply pinned Rustfmt
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agent-platform/src/confirmation.rs crates/agent-platform/src/lib.rs crates/agent-platform/tests/guarded_confirmation.rs crates/agent-platform/tests/guarded_confirmation_idempotency.rs
          git diff --cached --quiet && { echo "No formatting changes"; exit 1; }
          git commit -m "Apply canonical Rustfmt to confirmation protocol"
          git push origin HEAD:chat/guarded-confirmation-protocol
