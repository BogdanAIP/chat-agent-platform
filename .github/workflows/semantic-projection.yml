name: Semantic Projection Acceptance

on:
  pull_request:
    paths:
      - "runtime/semantic-projection/**"
      - "runtime/control_plane/**"
      - "runtime/local_vision_adapter/**"
      - "runtime/chat-profiles/semantic/**"
      - "config/local-vision-runtime.json"
      - "scripts/semantic-projection-runtime.ps1"
      - "scripts/start-semantic-profile.ps1"
      - "scripts/status-chat-profile.ps1"
      - "scripts/stop-chat-profile.ps1"
      - "scripts/chat-platform-controller.ps1"
      - "scripts/chat-platform.ps1"
      - "scripts/bootstrap-chat-platform.ps1"
      - "scripts/bootstrap-manager-runtime.ps1"
      - "scripts/local-vision-runtime.ps1"
      - "scripts/local-vision-runtime-watchdog.ps1"
      - "scripts/verify-local-vision-listener.ps1"
      - "scripts/production-visual-grounder.py"
      - "tests/fixtures/stage25_2_semantic_vision_fixture.html"
      - "project-context/TYPED_CAPABILITY_PROJECTION.md"
      - ".github/workflows/semantic-projection.yml"
  push:
    branches: [main]
    paths:
      - "runtime/semantic-projection/**"
      - "runtime/control_plane/**"
      - "runtime/local_vision_adapter/**"
      - "runtime/chat-profiles/semantic/**"
      - "config/local-vision-runtime.json"
      - "scripts/semantic-projection-runtime.ps1"
      - "scripts/start-semantic-profile.ps1"
      - "scripts/status-chat-profile.ps1"
      - "scripts/stop-chat-profile.ps1"
      - "scripts/chat-platform-controller.ps1"
      - "scripts/chat-platform.ps1"
      - "scripts/bootstrap-chat-platform.ps1"
      - "scripts/bootstrap-manager-runtime.ps1"
      - "scripts/local-vision-runtime.ps1"
      - "scripts/local-vision-runtime-watchdog.ps1"
      - "scripts/verify-local-vision-listener.ps1"
      - "scripts/production-visual-grounder.py"
      - "tests/fixtures/stage25_2_semantic_vision_fixture.html"
      - "project-context/TYPED_CAPABILITY_PROJECTION.md"
      - ".github/workflows/semantic-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-projection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-semantic-projection:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Environment
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) {
            throw 'Google Chrome is required for semantic projection browser acceptance.'
          }

      - name: Enforce fixed six-tool semantic projection contract
        shell: pwsh
        run: |
          $manifest = Get-Content 'runtime/semantic-projection/package.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $pins = [ordered]@{
            '@modelcontextprotocol/server' = '2.0.0'
            '@modelcontextprotocol/client' = '2.0.0'
            '@modelcontextprotocol/server-filesystem' = '2026.7.10'
            '@playwright/mcp' = '0.0.78'
            'zod' = '4.4.3'
          }
          foreach ($name in $pins.Keys) {
            if ([string]$manifest.dependencies.$name -ne [string]$pins[$name]) {
              throw "Semantic projection dependency pin drifted: $name"
            }
          }

          $lock = Get-Content 'runtime/semantic-projection/package-lock.json' -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          if ([int]$lock['lockfileVersion'] -ne 3) { throw 'Semantic projection lockfileVersion drifted.' }
          $rootPackage = $lock['packages']['']
          foreach ($name in $pins.Keys) {
            if ([string]$rootPackage['dependencies'][$name] -ne [string]$pins[$name]) {
              throw "Semantic projection lock dependency drifted: $name"
            }
          }

          $source = Get-Content 'runtime/semantic-projection/bin/semantic-control-plane-projection.mjs' -Raw -Encoding utf8
          foreach ($name in @('workspace_read','workspace_write','web_open','web_observe','web_interact','procedure_run')) {
            if ($source -notmatch "registerTool\(\s*'$([regex]::Escape($name))'") {
              throw "Canonical semantic projection is missing fixed tool '$name'."
            }
          }
          $registrations = [regex]::Matches($source, 'registerTool\(').Count
          if ($registrations -ne 6) { throw "Canonical semantic projection must register exactly six tools; found $registrations." }
          foreach ($forbidden in @('tool_invoke','tool_schema','mcp_enable','browser_run_code_unsafe','browser_evaluate','browser_file_upload','browser_network_request')) {
            if ($source -match [regex]::Escape($forbidden)) {
              throw "Canonical semantic projection source contains forbidden generic/unsafe marker '$forbidden'."
            }
          }
          if ($source -match "command:\s*'npx'" -or $source -match "command:\s*'cmd'.*npx") {
            throw 'Semantic projection must not perform downstream npm installs at tool-call time.'
          }

          $inner = Get-Content 'runtime/semantic-projection/bin/semantic-projection.mjs' -Raw -Encoding utf8
          $bridge = Get-Content 'runtime/semantic-projection/lib/browser-verification-bridge.mjs' -Raw -Encoding utf8
          if ($inner -notmatch 'verifyPlaywrightNavigation' -or $inner -notmatch 'captureBrowserObservation') {
            throw 'Semantic projection is missing Browser Verification Kernel integration.'
          }
          if ($bridge -notmatch 'browser_transition_cli\.py') {
            throw 'Browser verification bridge is not bound to the reviewed Python verifier.'
          }
          foreach ($forbidden in @('browser_evaluate','browser_run_code_unsafe','child_process.exec','shell: true')) {
            if ($bridge -match [regex]::Escape($forbidden)) {
              throw "Browser verification bridge contains forbidden marker '$forbidden'."
            }
          }

          $launcher = Get-Content 'runtime/semantic-projection/bin/semantic-projection-launcher.mjs' -Raw -Encoding utf8
          if ($launcher -notmatch 'semantic-control-plane-projection\.mjs') {
            throw 'Public semantic launcher is not permanently routed through the six-tool control plane.'
          }

          $config = Get-Content 'runtime/chat-profiles/semantic/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $servers = @($config.mcpServers.PSObject.Properties.Name)
          if ($servers.Count -ne 1 -or $servers[0] -ne 'semantic-projection') {
            throw "Semantic profile must expose exactly one projection server; found: $($servers -join ', ')"
          }
          $semantic = $config.mcpServers.'semantic-projection'
          if ([string]$semantic.command -ne 'node') {
            throw 'Semantic profile must launch the prepared projection directly with Node.'
          }
          if (@($semantic.args).Count -ne 1 -or [string]$semantic.args[0] -ne '${CHAT_SEMANTIC_PROJECTION_ENTRY}') {
            throw 'Semantic profile entrypoint contract drifted.'
          }
          if (@($semantic.tags) -notcontains 'procedure' -or @($semantic.tags) -notcontains 'control-plane') {
            throw 'Semantic profile does not declare its permanent procedure/control-plane capability.'
          }

      - name: Install locked projection dependencies
        shell: pwsh
        run: |
          Push-Location 'runtime/semantic-projection'
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

      - name: Run canonical six-tool acceptance and internal base regressions
        shell: pwsh
        run: |
          Push-Location 'runtime/semantic-projection'
          try {
            npm run acceptance:six-tool
            if ($LASTEXITCODE -ne 0) { throw "Canonical six-tool acceptance failed with exit code $LASTEXITCODE" }
            npm run acceptance
            if ($LASTEXITCODE -ne 0) { throw "Internal semantic base acceptance failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

      - name: Prove semantic runtime from standalone installed layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installedRoot = Join-Path $env:RUNNER_TEMP 'semantic-installed-app'
          $installedScripts = Join-Path $installedRoot 'scripts'
          $installedRuntime = Join-Path $installedRoot 'runtime'
          $installedConfig = Join-Path $installedRoot 'config'
          Remove-Item -LiteralPath $installedRoot -Recurse -Force -ErrorAction SilentlyContinue

          $scriptNames = @(
            'start-local-bridge.ps1',
            'status-local-bridge.ps1',
            'stop-local-bridge.ps1',
            'start-chat-profile.ps1',
            'start-semantic-profile.ps1',
            'semantic-projection-runtime.ps1',
            'status-chat-profile.ps1',
            'stop-chat-profile.ps1',
            'local-vision-runtime.ps1',
            'local-vision-runtime-watchdog.ps1',
            'verify-local-vision-listener.ps1',
            'production-visual-grounder.py'
          )
          foreach ($name in $scriptNames) {
            $destination = Join-Path $installedScripts $name
            New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
            Copy-Item -LiteralPath (Join-Path $PWD "scripts/$name") -Destination $destination -Force
          }

          $runtimeFiles = @(
            'runtime/mcp.json',
            'runtime/chat-profiles/files-readonly/mcp.json',
            'runtime/chat-profiles/browser-isolated/mcp.json',
            'runtime/chat-profiles/semantic/mcp.json',
            'runtime/semantic-projection/package.json',
            'runtime/semantic-projection/package-lock.json',
            'runtime/semantic-projection/bin/semantic-projection-launcher.mjs',
            'runtime/semantic-projection/bin/semantic-control-plane-projection.mjs',
            'runtime/semantic-projection/bin/semantic-projection.mjs',
            'runtime/semantic-projection/lib/browser-verification-bridge.mjs',
            'runtime/semantic-projection/lib/semantic-vision-click-router.mjs',
            'runtime/semantic-projection/lib/visual-grounding-bridge.mjs',
            'runtime/semantic-projection/lib/runtime-backed-bridge-grounder.mjs',
            'runtime/semantic-projection/lib/runtime-backed-visual-grounder.mjs',
            'runtime/control_plane/__init__.py',
            'runtime/control_plane/_verified_workspace_artifact_support.py',
            'runtime/control_plane/browser_observation.py',
            'runtime/control_plane/browser_transition.py',
            'runtime/control_plane/browser_transition_cli.py',
            'runtime/control_plane/cli.py',
            'runtime/control_plane/file_artifact_observation.py',
            'runtime/control_plane/verification.py',
            'runtime/control_plane/verified_workspace_artifact.py',
            'runtime/control_plane/windows_file_pin.py',
            'runtime/control_plane/working_state.py',
            'runtime/local_vision_adapter/__init__.py',
            'runtime/local_vision_adapter/benchmark.py',
            'runtime/local_vision_adapter/mark_grid.py',
            'runtime/local_vision_adapter/native_bbox.py',
            'runtime/local_vision_adapter/production_grounder.py',
            'runtime/local_vision_adapter/production_policy.py',
            'runtime/local_vision_adapter/provider.py',
            'runtime/local_vision_adapter/renderer.py'
          )
          foreach ($relative in $runtimeFiles) {
            $suffix = $relative.Substring('runtime/'.Length).Replace('/', [System.IO.Path]::DirectorySeparatorChar)
            $destination = Join-Path $installedRuntime $suffix
            New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
            Copy-Item -LiteralPath (Join-Path $PWD $relative) -Destination $destination -Force
          }

          New-Item -ItemType Directory -Force -Path $installedConfig | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'config/local-vision-runtime.json') -Destination (Join-Path $installedConfig 'local-vision-runtime.json') -Force

          foreach ($required in @(
            (Join-Path $installedRuntime 'semantic-projection/bin/semantic-control-plane-projection.mjs'),
            (Join-Path $installedRuntime 'semantic-projection/lib/browser-verification-bridge.mjs'),
            (Join-Path $installedRuntime 'control_plane/_verified_workspace_artifact_support.py'),
            (Join-Path $installedRuntime 'control_plane/browser_observation.py'),
            (Join-Path $installedRuntime 'control_plane/browser_transition.py'),
            (Join-Path $installedRuntime 'control_plane/browser_transition_cli.py'),
            (Join-Path $installedRuntime 'control_plane/cli.py'),
            (Join-Path $installedRuntime 'control_plane/file_artifact_observation.py'),
            (Join-Path $installedRuntime 'control_plane/verification.py'),
            (Join-Path $installedRuntime 'control_plane/verified_workspace_artifact.py'),
            (Join-Path $installedRuntime 'control_plane/windows_file_pin.py'),
            (Join-Path $installedRuntime 'control_plane/working_state.py'),
            (Join-Path $installedRuntime 'semantic-projection/lib/semantic-vision-click-router.mjs'),
            (Join-Path $installedRuntime 'semantic-projection/lib/runtime-backed-visual-grounder.mjs'),
            (Join-Path $installedRuntime 'local_vision_adapter/native_bbox.py'),
            (Join-Path $installedScripts 'local-vision-runtime.ps1'),
            (Join-Path $installedScripts 'production-visual-grounder.py'),
            (Join-Path $installedConfig 'local-vision-runtime.json')
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Standalone installed semantic/vision/control-plane asset missing: $required"
            }
          }
          Write-Host 'SEMANTIC_INSTALLED_SIX_TOOL_BUNDLE=PASS'
          Write-Host 'SEMANTIC_INSTALLED_BROWSER_VERIFIER=PASS'

          Push-Location (Join-Path $installedRuntime 'semantic-projection')
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Installed-layout semantic npm ci failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

          $workspace = Join-Path $env:RUNNER_TEMP 'semantic-installed-workspace'
          $procedureState = Join-Path $env:RUNNER_TEMP 'semantic-installed-procedure-state'
          Remove-Item -LiteralPath $workspace -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $procedureState -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          New-Item -ItemType Directory -Force -Path $procedureState | Out-Null
          Set-Content -LiteralPath (Join-Path $workspace 'input.txt') -Value 'SEMANTIC_INSTALLED_INPUT' -Encoding utf8

          $env:CAP_INSTALLED_RUNTIME = $installedRuntime
          $env:CAP_INSTALLED_WORKSPACE = $workspace
          $env:CAP_INSTALLED_PROCEDURE_STATE = $procedureState
          @'
          import os
          import sys
          from pathlib import Path

          runtime = Path(os.environ["CAP_INSTALLED_RUNTIME"])
          workspace = Path(os.environ["CAP_INSTALLED_WORKSPACE"])
          state_root = Path(os.environ["CAP_INSTALLED_PROCEDURE_STATE"])
          sys.path.insert(0, str(runtime))

          from control_plane.verified_workspace_artifact import run_verified_workspace_artifact

          artifact_name = "installed-stage26-3c.txt"
          content = "SEMANTIC_INSTALLED_STAGE26_3C_OK"
          request = {
              "procedure": "verified_workspace_artifact_v1",
              "artifact_name": artifact_name,
              "content": content,
          }
          result = run_verified_workspace_artifact(
              request,
              workspace_root=workspace,
              state_root=state_root,
              candidate_admission="stage26-3a-qualification",
          )
          if result.get("status") != "completed":
              raise SystemExit(f"installed procedure did not complete: {result}")
          if result.get("action_count") != 3 or result.get("current_node") != "completed":
              raise SystemExit(f"installed procedure action graph drifted: {result}")

          target = workspace / ".chat-agent-platform" / "stage26-3a" / artifact_name
          if target.read_text(encoding="utf-8") != content:
              raise SystemExit("installed procedure target bytes differ")

          repeat = run_verified_workspace_artifact(
              request,
              workspace_root=workspace,
              state_root=state_root,
              candidate_admission="stage26-3a-qualification",
          )
          if repeat.get("status") != "abstained":
              raise SystemExit(f"installed procedure repeat did not abstain: {repeat}")
          if repeat.get("action_count") != 0 or repeat.get("escalation_reason") != "target_already_exists":
              raise SystemExit(f"installed procedure repeat mutated or drifted: {repeat}")
          if target.read_text(encoding="utf-8") != content:
              raise SystemExit("installed procedure repeat changed target bytes")

          print("SEMANTIC_INSTALLED_PROCEDURE=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Standalone installed procedure proof failed with exit code $LASTEXITCODE" }

          try {
            & (Join-Path $installedScripts 'start-semantic-profile.ps1') -FilesRoot $workspace -Port 3068 -ReadyTimeoutSeconds 120
            $status = & (Join-Path $installedScripts 'status-chat-profile.ps1') -Port 3068 | Out-String | ConvertFrom-Json
            if ([int]$status.active_count -ne 1 -or [string]$status.active_profile -ne 'semantic' -or $status.conflict) {
              throw "Standalone installed layout did not start semantic cleanly: $($status | ConvertTo-Json -Compress)"
            }
            $semanticScope = @($status.scopes | Where-Object { [string]$_.profile -eq 'semantic' })
            if ($semanticScope.Count -ne 1 -or [string]$semanticScope[0].health_state -ne 'ready') {
              throw 'Standalone installed semantic health is not ready.'
            }

            Write-Host 'SEMANTIC_INSTALLED_LAYOUT=PASS'
            Write-Host 'SEMANTIC_INSTALLED_TOOL_COUNT=6'
            Write-Host 'SEMANTIC_INSTALLED_1MCP_REQUIRED=False'
          }
          finally {
            & (Join-Path $installedScripts 'stop-chat-profile.ps1')
          }

          $after = & (Join-Path $installedScripts 'status-chat-profile.ps1') -Port 3068 | Out-String | ConvertFrom-Json
          if ([int]$after.active_count -ne 0) { throw "Standalone installed semantic cleanup failed; active_count=$($after.active_count)." }
          Write-Host 'SEMANTIC_INSTALLED_CLEANUP=PASS'
