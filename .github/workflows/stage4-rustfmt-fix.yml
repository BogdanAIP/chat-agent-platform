name: Stage 4 Rustfmt Fix

on:
  push:
    branches: [chat/stage4-yandex-relay]
    paths:
      - ".github/workflows/stage4-rustfmt-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/stage4-yandex-relay
      - name: Install pinned Rustfmt
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Apply canonical rustfmt
        shell: pwsh
        run: |
          cargo fmt --all
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'crates/**/*.rs'
            git commit -m "Apply canonical Stage 4 rustfmt"
            git push origin HEAD:chat/stage4-yandex-relay
          }
