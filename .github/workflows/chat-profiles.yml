name: Chat Profile Acceptance

on:
  pull_request:
    paths:
      - "runtime/chat-profiles/files-readonly/**"
      - "runtime/chat-profiles/browser-isolated/**"
      - "runtime/chat-profiles/semantic/**"
      - "runtime/semantic-projection/**"
      - "scripts/semantic-direct-controller.ps1"
      - "scripts/chat-platform-controller.ps1"
      - "scripts/chat-platform.ps1"
      - "scripts/chat-platform-tray.ps1"
      - "scripts/bootstrap-chat-platform.ps1"
      - "scripts/bootstrap-tunnel-runtime.ps1"
      - "scripts/bootstrap-manager-runtime.ps1"
      - "scripts/bootstrap-manager-lifecycle.ps1"
      - "tests/test_extension_manager_boundary.py"
      - ".github/workflows/chat-profiles.yml"
      - "project-context/STAGE24_LEAST_PRIVILEGE.md"
  push:
    branches: [main]
    paths:
      - "runtime/chat-profiles/files-readonly/**"
      - "runtime/chat-profiles/browser-isolated/**"
      - "runtime/chat-profiles/semantic/**"
      - "runtime/semantic-projection/**"
      - "scripts/semantic-direct-controller.ps1"
      - "scripts/chat-platform-controller.ps1"
      - "scripts/chat-platform.ps1"
      - "scripts/chat-platform-tray.ps1"
      - "scripts/bootstrap-chat-platform.ps1"
      - "scripts/bootstrap-tunnel-runtime.ps1"
      - "scripts/bootstrap-manager-runtime.ps1"
      - "scripts/bootstrap-manager-lifecycle.ps1"
      - "tests/test_extension_manager_boundary.py"
      - ".github/workflows/chat-profiles.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-profiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-profiles:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Environment
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version

      - name: Parse baseline profile and manager scripts
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/semantic-direct-controller.ps1',
            'scripts/chat-platform-controller.ps1',
            'scripts/chat-platform.ps1',
            'scripts/chat-platform-tray.ps1',
            'scripts/bootstrap-chat-platform.ps1',
            'scripts/bootstrap-tunnel-runtime.ps1',
            'scripts/bootstrap-manager-runtime.ps1',
            'scripts/bootstrap-manager-lifecycle.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$script has PowerShell syntax errors: $($errors -join '; ')" }
          }

      - name: Enforce pinned compatibility profiles and six-tool semantic projection
        shell: pwsh
        run: |
          $files = Get-Content 'runtime/chat-profiles/files-readonly/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $browser = Get-Content 'runtime/chat-profiles/browser-isolated/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $semantic = Get-Content 'runtime/chat-profiles/semantic/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json

          $fileServers = @($files.mcpServers.PSObject.Properties)
          $browserServers = @($browser.mcpServers.PSObject.Properties)
          $semanticServers = @($semantic.mcpServers.PSObject.Properties)
          if ($fileServers.Count -ne 1 -or $fileServers[0].Name -ne 'filesystem') { throw 'Files compatibility profile must contain only filesystem.' }
          if ($browserServers.Count -ne 1 -or $browserServers[0].Name -ne 'playwright') { throw 'Browser compatibility profile must contain only playwright.' }
          if ($semanticServers.Count -ne 1 -or $semanticServers[0].Name -ne 'semantic-projection') { throw 'Semantic profile must contain only semantic-projection.' }
          if ([string]$semantic.mcpServers.'semantic-projection'.command -ne 'node') { throw 'Semantic profile must directly launch Node.' }
          if (@($semantic.mcpServers.'semantic-projection'.args).Count -ne 1 -or [string]$semantic.mcpServers.'semantic-projection'.args[0] -ne '${CHAT_SEMANTIC_PROJECTION_ENTRY}') { throw 'Semantic entrypoint contract drifted.' }
          if (@($semantic.mcpServers.'semantic-projection'.tags) -notcontains 'procedure' -or @($semantic.mcpServers.'semantic-projection'.tags) -notcontains 'control-plane') { throw 'Semantic profile must permanently expose the bounded procedure/control-plane capability.' }

          $fileRaw = Get-Content 'runtime/chat-profiles/files-readonly/mcp.json' -Raw -Encoding utf8
          $browserRaw = Get-Content 'runtime/chat-profiles/browser-isolated/mcp.json' -Raw -Encoding utf8
          $semanticRaw = Get-Content 'runtime/chat-profiles/semantic/mcp.json' -Raw -Encoding utf8
          if ($fileRaw -notmatch [regex]::Escape('@modelcontextprotocol/server-filesystem@2026.7.10')) { throw 'Filesystem pin drifted.' }
          if ($browserRaw -notmatch [regex]::Escape('@playwright/mcp@0.0.78')) { throw 'Playwright pin drifted.' }
          foreach ($tool in @('create_directory','write_file','edit_file','move_file')) {
            if (@($files.mcpServers.filesystem.disabledTools) -notcontains $tool) { throw "Files compatibility profile must disable $tool." }
          }
          foreach ($tool in @('browser_run_code_unsafe','browser_evaluate','browser_file_upload','browser_network_request')) {
            if (@($browser.mcpServers.playwright.disabledTools) -notcontains $tool) { throw "Browser compatibility profile must disable $tool." }
          }
          if ($fileRaw -match '@playwright/mcp|browser_') { throw 'Files compatibility profile contains browser capability.' }
          if ($browserRaw -match 'server-filesystem|CHAT_LOCAL_FILES_ROOT') { throw 'Browser compatibility profile contains filesystem capability.' }
          foreach ($forbidden in @('api_key','subscription','browserbase','apify','firecrawl')) {
            if (($fileRaw + $browserRaw + $semanticRaw).ToLowerInvariant() -match $forbidden) { throw "Unexpected paid/cloud dependency marker: $forbidden" }
          }

      - name: Prove promoted six-tool semantic profile routes through the public manager
        shell: pwsh
        run: |
          $filesRoot = Join-Path $env:RUNNER_TEMP 'chat-semantic-manager-files'
          New-Item -ItemType Directory -Force -Path $filesRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $filesRoot 'input.txt') -Value 'SEMANTIC_MANAGER_OK' -Encoding utf8

          ./scripts/chat-platform.ps1 -Action SetProfile -Profile semantic -FilesRoot $filesRoot -NoNotify
          if ($LASTEXITCODE -ne 0) { throw 'Public manager could not select promoted semantic profile.' }

          $managerStatus = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
          if ([bool]$managerStatus.mcp_ready -or [bool]$managerStatus.tunnel_running -or [bool]$managerStatus.tunnel_ready -or [int]$managerStatus.active_count -ne 0 -or [bool]$managerStatus.conflict) { throw 'Fresh promoted semantic route must remain stopped before hosted tunnel startup.' }
          if (-not [string]::IsNullOrWhiteSpace([string]$managerStatus.active_profile)) { throw 'Fresh promoted semantic route unexpectedly reported an active profile.' }
          if ([string]$managerStatus.tunnel_binding -ne 'direct-stdio') { throw 'Public semantic profile did not route to direct stdio.' }
          if ([string]$managerStatus.settings.profile -ne 'semantic') { throw 'Public manager did not persist semantic as the selected profile.' }
          if ([string]$managerStatus.settings.tunnel_profile -ne 'direct-stdio') { throw 'Promoted semantic settings retained the legacy 1MCP tunnel marker.' }
          if ([System.IO.Path]::GetFullPath([string]$managerStatus.settings.files_root) -ne [System.IO.Path]::GetFullPath($filesRoot)) { throw 'Public manager did not persist the semantic FilesRoot.' }

          $installedController = Join-Path $env:LOCALAPPDATA 'ChatAgentPlatform\app\scripts\semantic-direct-controller.ps1'
          if (-not (Test-Path -LiteralPath $installedController -PathType Leaf)) { throw 'Public semantic routing did not install the stable direct controller.' }
          $sourceHash = (Get-FileHash -LiteralPath 'scripts/semantic-direct-controller.ps1' -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash -LiteralPath $installedController -Algorithm SHA256).Hash
          if ($sourceHash -ne $installedHash) { throw 'Installed direct controller differs from the reviewed source.' }

          Write-Host 'SEMANTIC_PUBLIC_MANAGER_ROUTING=PASS'
          Write-Host 'SEMANTIC_PUBLIC_MANAGER_1MCP_REQUIRED=False'
