name: Stage 4 Secret Result Fix

on:
  push:
    branches: [chat/stage4-yandex-relay]
    paths:
      - ".github/workflows/stage4-secret-result-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/stage4-yandex-relay
      - name: Adapt poll result to SecretStore callback contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/agent-platform/src/transport/lifecycle.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "        let polled = store.with_secret(secret_ref, &selection, |secret| {\n",
                  "        let mut processed = None;\n        let polled = store.with_secret(secret_ref, &selection, |secret| {\n",
              ),
              (
                  "            poll_once(&binding, &paths.cache, &paths.http, endpoint, token)\n        });\n",
                  "            processed = poll_once(&binding, &paths.cache, &paths.http, endpoint, token)?;\n            Ok(())\n        });\n",
              ),
              (
                  "            Ok(processed) => {\n",
                  "            Ok(()) => {\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, got {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agent-platform/src/transport/lifecycle.rs
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Adapt relay poll result to SecretStore contract"
          git push origin HEAD:chat/stage4-yandex-relay
