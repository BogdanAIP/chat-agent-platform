name: ci

"on":
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  one-shot-schema2-identity-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.actor == 'BogdanAIP' &&
      github.event.pull_request.number == 126 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chat/stage26-3c-workspace-working-state'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chat/stage26-3c-workspace-working-state
          fetch-depth: 0
          persist-credentials: true

      - name: Apply confirmed schema-2 identity fix
        shell: bash
        run: |
          set -euo pipefail
          if test -e tests/test_stage26_3c_checkpoint_identity_validation.py; then
            echo 'ONE_SHOT_SCHEMA2_IDENTITY_FIX=already-applied'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          support_path = Path('runtime/control_plane/_verified_workspace_artifact_support.py')
          text = support_path.read_text(encoding='utf-8')
          needle = '''        if task_state["prepared_intent"] is not None and not isinstance(
              task_state["prepared_intent"], dict
          ):
              raise ValueError("resume checkpoint prepared_intent is invalid")
          return schema_version
          '''
          replacement = '''        if task_state["prepared_intent"] is not None and not isinstance(
              task_state["prepared_intent"], dict
          ):
              raise ValueError("resume checkpoint prepared_intent is invalid")

          owned_identity_fields = set(
              {
                  "staged_verified": ("staging_file_identity",),
                  "final_verified": (
                      "staging_file_identity",
                      "target_file_identity",
                  ),
                  "completed": ("target_file_identity",),
              }.get(str(task_state["current_node"]), ())
          )
          if str(task_state["status"]) == "completed":
              owned_identity_fields.add("target_file_identity")
          for field in sorted(owned_identity_fields):
              identity = _normalized_identity(task_state.get(field))
              if identity is None or "birthtime_ns" not in identity:
                  raise ValueError(
                      f"resume checkpoint {field} is missing generation-bound identity"
                  )
          return schema_version
          '''
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one validation insertion point, found {text.count(needle)}')
          support_path.write_text(text.replace(needle, replacement), encoding='utf-8', newline='\n')

          test_path = Path('tests/test_stage26_3c_checkpoint_identity_validation.py')
          test_path.write_text('''from __future__ import annotations

import unittest

from runtime.control_plane._verified_workspace_artifact_support import (
    CHECKPOINT_SCHEMA_VERSION,
    MAX_ACTIONS,
    PROCEDURE_ID,
    PROCEDURE_STATUS,
    PROCEDURE_VERSION,
    _validate_resume_state,
)


class Stage263CCheckpointIdentityValidationTests(unittest.TestCase):
    task_id = "a" * 32
    artifact_name = "identity-check.txt"
    expected_sha = "b" * 64
    content_size = 7
    relative_target = ".chat-agent-platform/stage26-3a/identity-check.txt"
    strong_identity = {"device": 1, "inode": 2, "birthtime_ns": 3}
    weak_identity = {"device": 1, "inode": 2}

    def checkpoint(
        self,
        node: str,
        *,
        status: str = "running",
        schema_version: int = CHECKPOINT_SCHEMA_VERSION,
    ) -> dict:
        action_count = {
            "preflight": 0,
            "staged_verified": 1,
            "final_verified": 2,
            "completed": 3,
        }[node]
        value = {
            "schema_version": schema_version,
            "task_id": self.task_id,
            "procedure_id": PROCEDURE_ID,
            "procedure_version": PROCEDURE_VERSION,
            "procedure_status": PROCEDURE_STATUS,
            "artifact_name": self.artifact_name,
            "artifact_relative_path": self.relative_target,
            "content_sha256": self.expected_sha,
            "content_size": self.content_size,
            "current_node": node,
            "status": status,
            "action_count": action_count,
            "action_budget": MAX_ACTIONS,
            "transition_receipts": [],
            "staging_file_identity": dict(self.strong_identity),
            "target_file_identity": dict(self.strong_identity),
        }
        if schema_version == CHECKPOINT_SCHEMA_VERSION:
            value["working_state"] = {}
            value["prepared_intent"] = None
        return value

    def validate(self, checkpoint: dict) -> int:
        return _validate_resume_state(
            checkpoint,
            task_id=self.task_id,
            artifact_name=self.artifact_name,
            expected_sha=self.expected_sha,
            content_size=self.content_size,
            relative_target=self.relative_target,
        )

    def test_schema2_staged_requires_retained_generation_identity(self) -> None:
        for value in (None, dict(self.weak_identity)):
            with self.subTest(value=value):
                checkpoint = self.checkpoint("staged_verified")
                checkpoint["staging_file_identity"] = value
                with self.assertRaisesRegex(ValueError, "staging_file_identity"):
                    self.validate(checkpoint)

    def test_schema2_final_requires_both_retained_generation_identities(self) -> None:
        for field in ("staging_file_identity", "target_file_identity"):
            for value in (None, dict(self.weak_identity)):
                with self.subTest(field=field, value=value):
                    checkpoint = self.checkpoint("final_verified")
                    checkpoint[field] = value
                    with self.assertRaisesRegex(ValueError, field):
                        self.validate(checkpoint)

    def test_schema2_completed_requires_retained_target_generation_identity(self) -> None:
        for node in ("completed", "preflight"):
            for value in (None, dict(self.weak_identity)):
                with self.subTest(node=node, value=value):
                    checkpoint = self.checkpoint(node, status="completed")
                    checkpoint["target_file_identity"] = value
                    with self.assertRaisesRegex(ValueError, "target_file_identity"):
                        self.validate(checkpoint)

    def test_schema2_preflight_does_not_invent_owned_identity_requirement(self) -> None:
        checkpoint = self.checkpoint("preflight")
        checkpoint["staging_file_identity"] = None
        checkpoint["target_file_identity"] = None
        self.assertEqual(self.validate(checkpoint), CHECKPOINT_SCHEMA_VERSION)

    def test_schema1_structural_validation_keeps_legacy_identity_policy_unchanged(self) -> None:
        checkpoint = self.checkpoint("staged_verified", schema_version=1)
        checkpoint["staging_file_identity"] = dict(self.weak_identity)
        checkpoint["target_file_identity"] = None
        self.assertEqual(self.validate(checkpoint), 1)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8', newline='\n')
          PY

          python -m unittest discover -s tests -p 'test_stage26_3c_checkpoint_identity_validation.py' -v
          git diff --check

          git config user.name 'chat-agent-platform one-shot fix'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/control_plane/_verified_workspace_artifact_support.py tests/test_stage26_3c_checkpoint_identity_validation.py
          git commit -m 'Stage 26.3C: reject missing schema-2 ownership identity'
          git push origin HEAD:chat/stage26-3c-workspace-working-state

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Historical regression anchors below are intentionally non-executable.
      # Existing tests use them to prove these accepted assets remain under the
      # central CI contract. Parsing itself is dynamic; do NOT add new scripts
      # to this comment when the repository grows.
      # scripts/chat-platform-controller.ps1
      # scripts/chat-platform.ps1
      # scripts/chat-platform-tray.ps1
      # scripts/bootstrap-chat-platform.ps1
      # scripts/start-chat-profile.ps1
      # scripts/stage26-windows-hot-runtime-fixture.ps1
      # scripts/stage26-windows-hot-runtime-benchmark.ps1
      # scripts/stage26-window-scoped-uia-benchmark.ps1
      # scripts/stage26-desktop-observation-qualification.ps1
      # scripts/stage26-desktop-grounder-qualification.ps1

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            Get-ChildItem -LiteralPath 'scripts' -Filter '*.ps1' -File -Recurse |
              Sort-Object FullName
          )
          if ($scripts.Count -eq 0) {
            throw 'No PowerShell scripts were discovered under scripts/.'
          }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $relative = [System.IO.Path]::GetRelativePath($PWD.Path, $script.FullName)
              throw "$relative has PowerShell syntax errors: $($errors -join '; ')"
            }
          }
          Write-Host "POWERSHELL_PARSE_COUNT=$($scripts.Count)"

      - name: Install Stage 25 vision test dependency
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw "python --version failed with exit code $LASTEXITCODE" }
          python -m pip install --disable-pip-version-check --no-input -r requirements-stage25-vision.txt
          if ($LASTEXITCODE -ne 0) { throw "vision dependency install failed with exit code $LASTEXITCODE" }

      - name: Run Python controller and vision contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Python unit/contract tests failed with exit code $LASTEXITCODE" }
          python ./scripts/stage25-grounding-benchmark.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Stage 25 grounding benchmark import/help smoke failed with exit code $LASTEXITCODE" }

      - name: Verify Stage 25 grounding browser fixture
        shell: pwsh
        run: |
          ./scripts/stage25-capture-grounding-fixture.ps1 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'stage25-grounding-fixture')

      - name: Enforce harmless reference config
        shell: pwsh
        run: |
          $config = Get-Content 'runtime/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $servers = @($config.mcpServers.PSObject.Properties)
          if ($servers.Count -ne 1 -or $servers[0].Name -ne 'sequential-thinking') {
            throw 'Reference config must expose exactly sequential-thinking.'
          }
          $args = @($servers[0].Value.args | ForEach-Object { [string]$_ })
          $expected = @('/c','npx','-y','@modelcontextprotocol/server-sequential-thinking@2026.7.4')
          if (($args -join "`n") -ne ($expected -join "`n")) {
            throw 'Sequential Thinking command/version drifted from the accepted reference.'
          }
          $raw = Get-Content 'runtime/mcp.json' -Raw -Encoding utf8
          foreach ($forbidden in @('filesystem','shell','powershell','browser','reaper','ffmpeg','blender','origin','get-env')) {
            if ($raw -match [regex]::Escape($forbidden)) { throw "Privileged module '$forbidden' is forbidden in the reference config." }
          }

      - name: Prove clean public semantic manager status without 1MCP
        shell: pwsh
        run: |
          $filesRoot = Join-Path $env:RUNNER_TEMP 'clean-semantic-status-workspace'
          New-Item -ItemType Directory -Force -Path $filesRoot | Out-Null
          ./scripts/chat-platform.ps1 -Action SetProfile -Profile semantic -FilesRoot $filesRoot -NoNotify
          if ($LASTEXITCODE -ne 0) { throw 'Could not select semantic profile for clean public status proof.' }

          $state = ./scripts/chat-platform.ps1 -Action Status -NoNotify |
            Out-String |
            ConvertFrom-Json
          if ($state.active_count -ne 0) {
            throw 'Manager should report zero active profiles on a clean runner.'
          }
          if ($state.tunnel_running -or $state.tunnel_ready) {
            throw 'Manager should not report a tunnel on a clean hosted runner.'
          }
          if ([string]$state.settings.profile -ne 'semantic') {
            throw 'Clean public manager status must use canonical semantic profile.'
          }
          if ([string]$state.tunnel_binding -ne 'direct-stdio') {
            throw 'Clean public manager status did not use direct-stdio binding.'
          }
          Write-Host 'BASELINE_1MCP_RUNTIME_REQUIRED=False'
