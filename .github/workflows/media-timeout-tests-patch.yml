name: Media Timeout Tests Patch

on:
  push:
    branches: [chat/media-runtime-hardening]
    paths:
      - ".github/workflows/media-timeout-tests-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/media-runtime-hardening
      - name: Add timeout budget unit tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/agent-platform/src/media.rs')
          text = p.read_text(encoding='utf-8')
          old = '''    #[test]\n    fn external_process_is_killed_after_timeout() {\n        let error = run_with_timeout(\n            "powershell",\n            &["-NoProfile", "-Command", "Start-Sleep -Seconds 5"],\n            Duration::from_millis(50),\n        )\n        .expect_err("sleeping process must time out");\n        assert!(matches!(error, PlatformError::ToolTimeout(_)));\n        assert_eq!(error.code(), "TOOL_TIMEOUT");\n        assert!(error.retryable());\n    }\n}\n'''
          new = '''    #[test]\n    fn external_process_is_killed_after_timeout() {\n        let error = run_with_timeout(\n            "powershell",\n            &["-NoProfile", "-Command", "Start-Sleep -Seconds 5"],\n            Duration::from_millis(50),\n        )\n        .expect_err("sleeping process must time out");\n        assert!(matches!(error, PlatformError::ToolTimeout(_)));\n        assert_eq!(error.code(), "TOOL_TIMEOUT");\n        assert!(error.retryable());\n    }\n\n    #[test]\n    fn media_timeout_scales_with_duration_and_is_bounded() {\n        assert_eq!(media_timeout(0.0), MEDIA_TIMEOUT_FLOOR);\n        assert_eq!(media_timeout(f64::NAN), MEDIA_TIMEOUT_FLOOR);\n        assert_eq!(media_timeout(1.0), MEDIA_TIMEOUT_FLOOR);\n        assert_eq!(media_timeout(30.0), Duration::from_secs(120));\n        assert_eq!(media_timeout(600.0), Duration::from_secs(1_830));\n        assert_eq!(media_timeout(100_000.0), MEDIA_TIMEOUT_CEILING);\n    }\n}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one test module tail, got {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Canonical format and commit
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agent-platform/src/media.rs
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Test duration-aware media timeout budget"
          git push origin HEAD:chat/media-runtime-hardening
