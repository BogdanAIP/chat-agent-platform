name: ci

"on":
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  one-shot-schema2-identity-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.actor == 'BogdanAIP' &&
      github.event.pull_request.number == 126 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chat/stage26-3c-workspace-working-state'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chat/stage26-3c-workspace-working-state
          fetch-depth: 0
          persist-credentials: true

      - name: Apply confirmed schema-2 identity fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('runtime/control_plane/_verified_workspace_artifact_support.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = '            raise ValueError("resume checkpoint prepared_intent is invalid")'
          matches = [index for index, line in enumerate(lines) if line == marker]
          if len(matches) != 1:
              raise SystemExit(f'expected one insertion marker, found {len(matches)}')
          index = matches[0]
          if index + 1 >= len(lines) or lines[index + 1] != '    return schema_version':
              raise SystemExit('resume validation return moved unexpectedly')
          insertion = [
              '',
              '        owned_identity_fields = set(',
              '            {',
              '                "staged_verified": ("staging_file_identity",),',
              '                "final_verified": (',
              '                    "staging_file_identity",',
              '                    "target_file_identity",',
              '                ),',
              '                "completed": ("target_file_identity",),',
              '            }.get(str(task_state["current_node"]), ())',
              '        )',
              '        if str(task_state["status"]) == "completed":',
              '            owned_identity_fields.add("target_file_identity")',
              '        for field in sorted(owned_identity_fields):',
              '            identity = _normalized_identity(task_state.get(field))',
              '            if identity is None or "birthtime_ns" not in identity:',
              '                raise ValueError(',
              '                    f"resume checkpoint {field} is missing generation-bound identity"',
              '                )',
          ]
          lines[index + 1:index + 1] = insertion
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          python -m unittest discover -s tests -p 'test_stage26_3c_checkpoint_identity_validation.py' -v
          git diff --check

          if git diff --quiet -- runtime/control_plane/_verified_workspace_artifact_support.py; then
            echo 'Expected support-file patch was not produced.' >&2
            exit 1
          fi

          git config user.name 'chat-agent-platform one-shot fix'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/control_plane/_verified_workspace_artifact_support.py
          git commit -m 'Stage 26.3C: reject missing schema-2 ownership identity'
          git push origin HEAD:chat/stage26-3c-workspace-working-state

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Historical regression anchors below are intentionally non-executable.
      # Existing tests use them to prove these accepted assets remain under the
      # central CI contract. Parsing itself is dynamic; do NOT add new scripts
      # to this comment when the repository grows.
      # scripts/chat-platform-controller.ps1
      # scripts/chat-platform.ps1
      # scripts/chat-platform-tray.ps1
      # scripts/bootstrap-chat-platform.ps1
      # scripts/start-chat-profile.ps1
      # scripts/stage26-windows-hot-runtime-fixture.ps1
      # scripts/stage26-windows-hot-runtime-benchmark.ps1
      # scripts/stage26-window-scoped-uia-benchmark.ps1
      # scripts/stage26-desktop-observation-qualification.ps1
      # scripts/stage26-desktop-grounder-qualification.ps1

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            Get-ChildItem -LiteralPath 'scripts' -Filter '*.ps1' -File -Recurse |
              Sort-Object FullName
          )
          if ($scripts.Count -eq 0) {
            throw 'No PowerShell scripts were discovered under scripts/.'
          }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $relative = [System.IO.Path]::GetRelativePath($PWD.Path, $script.FullName)
              throw "$relative has PowerShell syntax errors: $($errors -join '; ')"
            }
          }
          Write-Host "POWERSHELL_PARSE_COUNT=$($scripts.Count)"

      - name: Install Stage 25 vision test dependency
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw "python --version failed with exit code $LASTEXITCODE" }
          python -m pip install --disable-pip-version-check --no-input -r requirements-stage25-vision.txt
          if ($LASTEXITCODE -ne 0) { throw "vision dependency install failed with exit code $LASTEXITCODE" }

      - name: Run Python controller and vision contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Python unit/contract tests failed with exit code $LASTEXITCODE" }
          python ./scripts/stage25-grounding-benchmark.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Stage 25 grounding benchmark import/help smoke failed with exit code $LASTEXITCODE" }

      - name: Verify Stage 25 grounding browser fixture
        shell: pwsh
        run: |
          ./scripts/stage25-capture-grounding-fixture.ps1 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'stage25-grounding-fixture')

      - name: Enforce harmless reference config
        shell: pwsh
        run: |
          $config = Get-Content 'runtime/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $servers = @($config.mcpServers.PSObject.Properties)
          if ($servers.Count -ne 1 -or $servers[0].Name -ne 'sequential-thinking') {
            throw 'Reference config must expose exactly sequential-thinking.'
          }
          $args = @($servers[0].Value.args | ForEach-Object { [string]$_ })
          $expected = @('/c','npx','-y','@modelcontextprotocol/server-sequential-thinking@2026.7.4')
          if (($args -join "`n") -ne ($expected -join "`n")) {
            throw 'Sequential Thinking command/version drifted from the accepted reference.'
          }
          $raw = Get-Content 'runtime/mcp.json' -Raw -Encoding utf8
          foreach ($forbidden in @('filesystem','shell','powershell','browser','reaper','ffmpeg','blender','origin','get-env')) {
            if ($raw -match [regex]::Escape($forbidden)) { throw "Privileged module '$forbidden' is forbidden in the reference config." }
          }

      - name: Prove clean public semantic manager status without 1MCP
        shell: pwsh
        run: |
          $filesRoot = Join-Path $env:RUNNER_TEMP 'clean-semantic-status-workspace'
          New-Item -ItemType Directory -Force -Path $filesRoot | Out-Null
          ./scripts/chat-platform.ps1 -Action SetProfile -Profile semantic -FilesRoot $filesRoot -NoNotify
          if ($LASTEXITCODE -ne 0) { throw 'Could not select semantic profile for clean public status proof.' }

          $state = ./scripts/chat-platform.ps1 -Action Status -NoNotify |
            Out-String |
            ConvertFrom-Json
          if ($state.active_count -ne 0) {
            throw 'Manager should report zero active profiles on a clean runner.'
          }
          if ($state.tunnel_running -or $state.tunnel_ready) {
            throw 'Manager should not report a tunnel on a clean hosted runner.'
          }
          if ([string]$state.settings.profile -ne 'semantic') {
            throw 'Clean public manager status must use canonical semantic profile.'
          }
          if ([string]$state.tunnel_binding -ne 'direct-stdio') {
            throw 'Clean public manager status did not use direct-stdio binding.'
          }
          Write-Host 'BASELINE_1MCP_RUNTIME_REQUIRED=False'
