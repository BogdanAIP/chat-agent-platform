name: Stage 19 Matchering E2E

on:
  pull_request:
    paths:
      - "crates/agent-platform/src/reference_mastering.rs"
      - "crates/agent-platform/tests/stage19_reference_mastering.rs"
      - "crates/agent-platform/src/lib.rs"
      - "crates/agent-platform/src/main.rs"
      - "scripts/matchering_adapter.py"
      - ".github/workflows/stage19-matchering.yml"
      - "config/tools.yaml"
      - "config/tool-lock.yaml"
      - "config/capability-requirements.yaml"
      - "config/policy.yaml"
  push:
    branches: [main]
    paths:
      - "crates/agent-platform/src/reference_mastering.rs"
      - "crates/agent-platform/tests/stage19_reference_mastering.rs"
      - "crates/agent-platform/src/lib.rs"
      - "crates/agent-platform/src/main.rs"
      - "scripts/matchering_adapter.py"
      - ".github/workflows/stage19-matchering.yml"
      - "config/tools.yaml"
      - "config/tool-lock.yaml"
      - "config/capability-requirements.yaml"
      - "config/policy.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage19-matchering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matchering-e2e:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Ensure FFmpeg is available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version
      - name: Install pinned Matchering edge runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install "matchering==2.0.6" --disable-pip-version-check
          python -m pip check
          python -m py_compile scripts/matchering_adapter.py
          $env:MATCHERING_PYTHON = (Get-Command python).Source
          python scripts/matchering_adapter.py probe
      - name: Run Stage 19 real E2E
        shell: pwsh
        run: |
          $env:MATCHERING_PYTHON = (Get-Command python).Source
          cargo test -p agent-platform --test stage19_reference_mastering -- --ignored --nocapture
