name: stage8-trylock-fix

"on":
  push:
    branches: [chat/stage8-artifact-staging]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/stage8-artifact-staging
          fetch-depth: 0

      - name: Patch TryLockError handling
        shell: pwsh
        run: |
          $path = 'crates/agent-platform/src/artifact.rs'
          $content = Get-Content $path -Raw
          $newline = [Environment]::NewLine

          $pendingPattern = '        Err\(error\) if error\.kind\(\) == ErrorKind::WouldBlock => Ok\(PendingCleanup::Active\),\r?\n        Err\(error\) => Err\(io_error\("cannot probe pending artifact lock", error\)\),'
          $pendingReplacement = '        Err(std::fs::TryLockError::WouldBlock) => Ok(PendingCleanup::Active),' + $newline + '        Err(std::fs::TryLockError::Error(error)) => {' + $newline + '            Err(io_error("cannot probe pending artifact lock", error))' + $newline + '        }'
          $patched = [regex]::Replace($content, $pendingPattern, $pendingReplacement)

          $orphanPattern = '        Err\(error\) if error\.kind\(\) == ErrorKind::WouldBlock => Ok\(\(\)\),\r?\n        Err\(error\) => Err\(io_error\("cannot probe orphan pending lock", error\)\),'
          $orphanReplacement = '        Err(std::fs::TryLockError::WouldBlock) => Ok(()),' + $newline + '        Err(std::fs::TryLockError::Error(error)) => {' + $newline + '            Err(io_error("cannot probe orphan pending lock", error))' + $newline + '        }'
          $patched = [regex]::Replace($patched, $orphanPattern, $orphanReplacement)

          if ($patched -eq $content) {
            throw 'Expected TryLockError patch did not change artifact.rs'
          }
          Set-Content -Path $path -Value $patched -NoNewline
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m 'Handle typed TryLockError variants'
          git push origin HEAD:chat/stage8-artifact-staging
