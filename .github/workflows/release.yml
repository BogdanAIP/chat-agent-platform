name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to package"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: meta
        name: Validate tag, versions, and main ancestry
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be exactly vX.Y.Z, got: $tag" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          fi
          tag_sha="$(git rev-list -n 1 "$tag")"
          if [[ "$tag_sha" != "$GITHUB_SHA" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "Pushed tag SHA does not match workflow SHA" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$tag_sha" origin/main || {
            echo "Release tag must point to a commit reachable from main" >&2
            exit 1
          }
          git checkout --detach "$tag_sha"
          if [[ "$(git rev-parse HEAD)" != "$tag_sha" ]]; then
            echo "Release validation checkout does not match requested tag SHA" >&2
            exit 1
          fi
          readarray -t versions < <(python - <<'PY'
          import ast
          import pathlib
          import tomllib

          cargo = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))
          pyproject = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          init_tree = ast.parse(pathlib.Path('agent_platform/__init__.py').read_text(encoding='utf-8'))
          oracle = None
          for node in init_tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == '__version__':
                          oracle = ast.literal_eval(node.value)
          if not isinstance(oracle, str):
              raise SystemExit('agent_platform.__version__ is missing')
          print(cargo['workspace']['package']['version'])
          print(pyproject['project']['version'])
          print(oracle)
          PY
          )
          rust_version="${versions[0]}"
          python_package_version="${versions[1]}"
          python_oracle_version="${versions[2]}"
          if [[ "$rust_version" != "$python_package_version" || "$rust_version" != "$python_oracle_version" ]]; then
            echo "Version drift at tag $tag: Rust=$rust_version pyproject=$python_package_version oracle=$python_oracle_version" >&2
            exit 1
          fi
          if [[ "$tag" != "v$rust_version" ]]; then
            echo "Tag $tag does not match project version $rust_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$rust_version" >> "$GITHUB_OUTPUT"

  windows-binary:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-
      - name: Build locked release binary
        shell: pwsh
        run: cargo build --workspace --release --locked
      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path runtime/release -Force | Out-Null
          Copy-Item target/release/agent-platform.exe runtime/release/agent-platform.exe
          if ((Get-Item runtime/release/agent-platform.exe).Length -le 0) { throw 'release binary is empty' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-binary
          path: runtime/release/agent-platform.exe
          if-no-files-found: error
          retention-days: 30

  sbom:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Cache cargo-cyclonedx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: cargo-cyclonedx-0.5.9-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned cargo-cyclonedx
        shell: bash
        run: |
          if ! cargo cyclonedx --version 2>/dev/null | grep -q '0.5.9'; then
            cargo install --locked cargo-cyclonedx --version 0.5.9
          fi
      - name: Generate reproducible CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo cyclonedx \
            --manifest-path crates/agent-platform/Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --target all \
            --all-features \
            --override-filename agent-platform.cdx
          mapfile -t generated < <(find "$GITHUB_WORKSPACE" -type f -name 'agent-platform.cdx.json' -print)
          [[ "${#generated[@]}" -eq 1 ]] || {
            printf 'Expected exactly one generated SBOM, found %s\n' "${#generated[@]}" >&2
            printf '%s\n' "${generated[@]}" >&2
            exit 1
          }
          mkdir -p runtime/release
          cp "${generated[0]}" runtime/release/agent-platform.cdx.json
          python -m json.tool runtime/release/agent-platform.cdx.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: runtime/release/agent-platform.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate, windows-binary, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-windows-binary
          path: runtime/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom
          path: runtime/release
      - name: Assemble archive and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cd runtime/release
          test -s agent-platform.exe
          test -s agent-platform.cdx.json
          zip -9 "agent-platform-${RELEASE_TAG}-windows-x86_64.zip" agent-platform.exe agent-platform.cdx.json
          sha256sum agent-platform.exe agent-platform.cdx.json "agent-platform-${RELEASE_TAG}-windows-x86_64.zip" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create immutable GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite immutable release assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            runtime/release/agent-platform.exe \
            runtime/release/agent-platform.cdx.json \
            "runtime/release/agent-platform-${RELEASE_TAG}-windows-x86_64.zip" \
            runtime/release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
