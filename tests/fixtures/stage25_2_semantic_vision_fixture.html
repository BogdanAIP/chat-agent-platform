<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stage 25.2 Semantic Vision Fixture</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; font-family: Arial, sans-serif; }
    body { position: relative; background: white; color: black; }
    #semantic-save { position: absolute; left: 80px; top: 120px; width: 160px; height: 48px; }
    #delete-a { position: absolute; left: 80px; top: 220px; width: 140px; height: 44px; }
    #delete-b { position: absolute; left: 240px; top: 220px; width: 140px; height: 44px; }
    #visual-launch {
      position: absolute;
      left: 500px;
      top: 300px;
      width: 200px;
      height: 60px;
      box-sizing: border-box;
      border: 2px solid #222;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f2;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    #marker { position: absolute; left: 80px; top: 420px; }
  </style>
</head>
<body>
  <button id="semantic-save" type="button">Save</button>
  <button id="delete-a" type="button">Delete</button>
  <button id="delete-b" type="button">Delete</button>
  <div id="visual-launch" aria-hidden="true">Launch</div>
  <div id="marker" aria-live="polite"></div>
  <script>
    const marker = document.getElementById('marker');
    document.getElementById('semantic-save').addEventListener('click', () => {
      marker.textContent = 'CLICKED:semantic-save';
    });
    document.getElementById('delete-a').addEventListener('click', () => {
      marker.textContent = 'CLICKED:delete-a';
    });
    document.getElementById('delete-b').addEventListener('click', () => {
      marker.textContent = 'CLICKED:delete-b';
    });
    document.getElementById('visual-launch').addEventListener('click', () => {
      marker.textContent = 'CLICKED:visual-launch';
    });
  </script>
</body>
</html>
