name: ci

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Parse lifecycle scripts
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/start-local-bridge.ps1',
            'scripts/status-local-bridge.ps1',
            'scripts/stop-local-bridge.ps1',
            'scripts/start-chat-profile.ps1',
            'scripts/start-semantic-profile.ps1',
            'scripts/semantic-projection-runtime.ps1',
            'scripts/status-chat-profile.ps1',
            'scripts/stop-chat-profile.ps1',
            'scripts/chat-platform-controller.ps1',
            'scripts/chat-platform.ps1',
            'scripts/chat-platform-tray.ps1',
            'scripts/bootstrap-chat-platform.ps1',
            'scripts/stage25-capture-grounding-fixture.ps1',
            'scripts/stage25-run-grounding-benchmark.ps1',
            'scripts/stage26-openadapt-qualification.ps1',
            'scripts/stage26-openadapt-capture-qualification.ps1',
            'scripts/stage26-windows-capture-fixture.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) { throw "$script has PowerShell syntax errors: $($errors -join '; ')" }
          }

      - name: Install Stage 25 vision test dependency
        shell: pwsh
        run: |
          python --version
          python -m pip install --disable-pip-version-check --no-input -r requirements-stage25-vision.txt

      - name: Run Python controller and vision contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python ./scripts/stage25-grounding-benchmark.py --help | Out-Null

      - name: Verify Stage 25 grounding browser fixture
        shell: pwsh
        run: |
          ./scripts/stage25-capture-grounding-fixture.ps1 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'stage25-grounding-fixture')

      - name: Enforce harmless reference config
        shell: pwsh
        run: |
          $config = Get-Content 'runtime/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $servers = @($config.mcpServers.PSObject.Properties)
          if ($servers.Count -ne 1 -or $servers[0].Name -ne 'sequential-thinking') {
            throw 'Reference config must expose exactly sequential-thinking.'
          }
          $args = @($servers[0].Value.args | ForEach-Object { [string]$_ })
          $expected = @('/c','npx','-y','@modelcontextprotocol/server-sequential-thinking@2026.7.4')
          if (($args -join "`n") -ne ($expected -join "`n")) {
            throw 'Sequential Thinking command/version drifted from the accepted reference.'
          }
          $raw = Get-Content 'runtime/mcp.json' -Raw -Encoding utf8
          foreach ($forbidden in @('filesystem','shell','powershell','browser','reaper','ffmpeg','blender','origin','get-env')) {
            if ($raw -match [regex]::Escape($forbidden)) { throw "Privileged module '$forbidden' is forbidden in the reference config." }
          }

      - name: Prove local MCP runtime on Windows
        shell: pwsh
        run: |
          try {
            # Hosted runners have an empty npm cache. Keep the production default
            # strict, but give CI enough time to download pinned packages before
            # judging MCP readiness.
            ./scripts/start-local-bridge.ps1 -Port 3059 -ReadyTimeoutSeconds 240
            ./scripts/status-local-bridge.ps1 -Port 3059
          }
          finally {
            ./scripts/stop-local-bridge.ps1
          }

      - name: Prove clean public manager status path
        shell: pwsh
        run: |
          ./scripts/stop-chat-profile.ps1
          $state = ./scripts/chat-platform.ps1 -Action Status -NoNotify |
            Out-String |
            ConvertFrom-Json
          if ($state.active_count -ne 0) {
            throw 'Manager should report zero active profiles after cleanup.'
          }
          if ($state.tunnel_running -or $state.tunnel_ready) {
            throw 'Manager should not report a tunnel on a clean hosted runner.'
          }
          if ([string]$state.settings.profile -ne 'reference') {
            throw 'Clean manager status must preserve the reference default.'
          }
