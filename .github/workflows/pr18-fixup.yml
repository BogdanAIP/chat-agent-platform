name: PR18 Fixup

on:
  push:
    branches: [chat/capability-runtime-hardening]
    paths:
      - ".github/workflows/pr18-fixup.yml"

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/capability-runtime-hardening
      - name: Remove unused receiver and format Rust
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/agent-platform/src/capability.rs')
          text = p.read_text(encoding='utf-8')
          text = text.replace('self.validate_runtime_selection(capability, spec, requirement)?;', 'Self::validate_runtime_selection(capability, spec, requirement)?;')
          text = text.replace('self.validate_runtime_selection(&capability, spec, requirement)?;', 'Self::validate_runtime_selection(&capability, spec, requirement)?;')
          old = '''    fn validate_runtime_selection(\n        &self,\n        capability: &str,\n'''
          new = '''    fn validate_runtime_selection(\n        capability: &str,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one validate_runtime_selection definition, got {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Install pinned rustfmt
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Canonical formatting and commit
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agent-platform/src/capability.rs crates/agent-platform/tests/runtime_profile.rs
          git diff --cached --quiet && { echo "No fix produced"; exit 1; }
          git commit -m "Fix strict Rust formatting and Clippy"
          git push origin HEAD:chat/capability-runtime-hardening
