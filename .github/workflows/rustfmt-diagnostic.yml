name: Rustfmt Diagnostic

on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - ".github/workflows/rustfmt-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: rustfmt-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rustfmt-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rustfmt
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Apply canonical rustfmt
        shell: pwsh
        run: |
          cargo fmt --all
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'crates/**/*.rs'
            git commit -m "Apply canonical rustfmt"
            git push origin HEAD:${{ github.head_ref }}
          }
