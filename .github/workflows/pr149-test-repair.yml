name: PR149 one-shot fixture repair

"on":
  push:
    branches: [chat/agent-session-delegation-reentry]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chat/agent-session-delegation-reentry
          fetch-depth: 0
      - name: Patch stale fixtures and self-remove
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/repair.py
          python /tmp/repair.py
          git rm .github/workflows/pr149-test-repair.yml
          git diff --check
          python -m unittest \
            tests.test_chatgpt_temporary_multi_monitor_recovery.CleanupAuthorizationRearmTests \
            tests.test_chatgpt_temporary_review_findings_runtime.FreshReviewFindingRuntimeTests.test_capture_transport_ack_loss_rearms_and_terminal_status_closes \
            tests.test_chatgpt_temporary_extension_contract.ChatGPTTemporaryExtensionContractTests.test_result_capture_requires_exact_single_structured_block \
            tests.test_chatgpt_temporary_adapter.ChatGPTTemporaryAdapterTests.test_result_parser_rejects_foreign_or_ambiguous_child_output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(agent-sessions): align stale fixtures with final contracts'
          git push origin HEAD:chat/agent-session-delegation-reentry
