name: Bridge Pilot Safety

on:
  pull_request:
    paths:
      - "runtime/bridge-pilot/**"
      - "scripts/start-chat-bridge-pilot.ps1"
      - "scripts/stop-chat-bridge-pilot.ps1"
      - ".github/workflows/bridge-pilot.yml"
  push:
    branches: [main]
    paths:
      - "runtime/bridge-pilot/**"
      - "scripts/start-chat-bridge-pilot.ps1"
      - "scripts/stop-chat-bridge-pilot.ps1"
      - ".github/workflows/bridge-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows-pilot:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Parse PowerShell pilot scripts
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/start-chat-bridge-pilot.ps1',
            'scripts/stop-chat-bridge-pilot.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
              exit 1
            }
          }

      - name: Enforce harmless pinned pilot inventory
        shell: pwsh
        run: |
          $config = Get-Content 'runtime/bridge-pilot/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $servers = @($config.mcpServers.PSObject.Properties)
          if ($servers.Count -ne 1) {
            throw "Bridge pilot must expose exactly one upstream server; found $($servers.Count)."
          }
          $server = $servers[0]
          if ($server.Name -ne 'sequential-thinking') {
            throw "Unexpected bridge-pilot server: $($server.Name)"
          }
          if ([string]$server.Value.command -ne 'cmd') {
            throw 'Windows pilot must launch the reference server through cmd.'
          }
          $args = @($server.Value.args | ForEach-Object { [string]$_ })
          $expected = @('/c', 'npx', '-y', '@modelcontextprotocol/server-sequential-thinking@2026.7.4')
          if (($args -join "`n") -ne ($expected -join "`n")) {
            throw "Pilot command drifted from the pinned harmless reference server: $($args -join ' ')"
          }
          $json = Get-Content 'runtime/bridge-pilot/mcp.json' -Raw -Encoding utf8
          foreach ($forbidden in @('filesystem', 'shell', 'powershell', 'browser', 'reaper', 'ffmpeg', 'blender', 'origin')) {
            if ($json -match [regex]::Escape($forbidden)) {
              throw "Privileged/example module '$forbidden' must not be added to the unauthenticated bridge pilot."
            }
          }

      - name: Enforce isolated Funnel port and pinned runtime
        shell: pwsh
        run: |
          $start = Get-Content 'scripts/start-chat-bridge-pilot.ps1' -Raw -Encoding utf8
          $stop = Get-Content 'scripts/stop-chat-bridge-pilot.ps1' -Raw -Encoding utf8
          if ($start -notmatch [regex]::Escape("@1mcp/agent@0.34.4")) {
            throw 'Bridge pilot must pin 1MCP runtime version.'
          }
          if ($start -notmatch 'FunnelPort\s*=\s*8443') {
            throw 'Bridge pilot must default to isolated Funnel HTTPS 8443.'
          }
          if ($start -match 'funnel\s+reset' -or $stop -match 'funnel\s+reset') {
            throw 'Bridge pilot must never reset all Funnel routes.'
          }
          if ($start -match '--https=443' -or $stop -match '--https=443') {
            throw 'Bridge pilot must not modify the existing HTTPS 443 Funnel route.'
          }

      - name: Prove pinned 1MCP and reference server on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          npx --version
          $pkg = '@1mcp/agent@0.34.4'
          $config = Join-Path $PWD 'runtime/bridge-pilot/mcp.json'
          $port = 3059
          try {
            & npx.cmd -y $pkg --version
            if ($LASTEXITCODE -ne 0) { throw 'Pinned 1MCP package did not resolve.' }

            & npx.cmd -y $pkg serve `
              --config $config `
              --host 127.0.0.1 `
              --port $port `
              --filter pilot `
              --health-info-level minimal `
              --enable-async-loading `
              --background
            if ($LASTEXITCODE -ne 0) { throw 'Pinned 1MCP runtime did not start.' }

            $ready = $false
            $healthUri = "http://127.0.0.1:$port/health/mcp/sequential-thinking"
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              try {
                $server = Invoke-RestMethod -Method Get -Uri $healthUri -TimeoutSec 5
                if ([string]$server.state -eq 'ready') {
                  $ready = $true
                  break
                }
              }
              catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw "Pinned Sequential Thinking server did not become ready: $healthUri"
            }

            Write-Host 'Pinned 1MCP + Sequential Thinking Windows runtime is ready.'
          }
          finally {
            & npx.cmd -y $pkg serve --config $config --stop
            if ($LASTEXITCODE -notin @(0, 3)) {
              Write-Warning "1MCP cleanup returned exit code $LASTEXITCODE"
            }
          }
