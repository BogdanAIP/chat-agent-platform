name: Temporary Semantic Lockfile Generator

on:
  push:
    branches:
      - chat/tmp-semantic-lockgen

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate npm lockfile only
        shell: bash
        run: |
          set -euo pipefail
          cd runtime/semantic-projection
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- runtime/semantic-projection/package-lock.json && git ls-files --error-unmatch runtime/semantic-projection/package-lock.json >/dev/null 2>&1; then
            echo 'LOCKFILE_ALREADY_COMMITTED=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/semantic-projection/package-lock.json
          git commit -m 'Temporary: generated semantic projection lockfile'
          git push origin HEAD:chat/tmp-semantic-lockgen
          echo 'LOCKFILE_GENERATED=PASS'
