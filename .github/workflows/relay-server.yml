name: Relay Server

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/relay-server/**"
      - ".github/workflows/relay-server.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/relay-server/**"
      - ".github/workflows/relay-server.yml"
  workflow_dispatch:

concurrency:
  group: relay-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  normalize-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'chat/rust-relay-server' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chat/rust-relay-server
          persist-credentials: true

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Apply compiler fix, format, and resolve lockfile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/relay-server/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = 'headers.insert(CONTENT_TYPE_OPTIONS, HeaderValue::from_static("nosniff"));'
          new = '''headers.insert(
                  CONTENT_TYPE_OPTIONS.clone(),
                  HeaderValue::from_static("nosniff"),
              );'''
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit normalized sources when needed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock crates/relay-server/src; then
            echo 'Relay source and lockfile already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/relay-server/src
          git commit -m 'Normalize Rust relay sources and lockfile'
          git push origin HEAD:chat/rust-relay-server

  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Verify committed lockfile and formatting
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo fmt --all -- --check

      - name: Verify lints, tests, and release build
        shell: bash
        run: |
          cargo clippy -p relay-server --all-targets --locked -- -D warnings
          cargo test -p relay-server --locked
          cargo build -p relay-server --release --locked

      - name: Smoke-test GPT header compatibility and relay round trip
        shell: bash
        run: |
          set -euo pipefail
          export RELAY_PROJECT_ID='chat-agent-platform'
          export RELAY_MCP_TOKEN='remote-token-abcdefghijklmnopqrstuvwxyz'
          export RELAY_AGENT_TOKEN='agent-token-abcdefghijklmnopqrstuvwxyz0'
          export RELAY_DATABASE="$RUNNER_TEMP/relay.sqlite3"
          export RELAY_BIND='127.0.0.1:8787'

          target/release/relay-server >"$RUNNER_TEMP/relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/relay.log"' EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:8787/healthz | python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "ok"'

          curl --fail --silent \
            -H "X-Agent-Token: $RELAY_AGENT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"agent_action":"poll","project_id":"chat-agent-platform","wait_seconds":1,"operations":["local_ping","runtime_self_test"]}' \
            http://127.0.0.1:8787/ \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data == {"ok": True, "task": None}'

          action_file="$RUNNER_TEMP/action.json"
          curl --fail --silent \
            -H "X-MCP-Token: $RELAY_MCP_TOKEN" \
            -H 'X-Request-Id: eca27359-989e-4d83-a24d-3592998fe7f5/probe' \
            -H 'Content-Type: application/json' \
            --data '{"action":"local_ping","message":"relay server acceptance"}' \
            http://127.0.0.1:8787/ >"$action_file" &
          action_pid=$!

          sleep 0.2
          task_file="$RUNNER_TEMP/task.json"
          curl --fail --silent \
            -H "X-Agent-Token: $RELAY_AGENT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"agent_action":"poll","project_id":"chat-agent-platform","wait_seconds":2,"operations":["local_ping","runtime_self_test"]}' \
            http://127.0.0.1:8787/ >"$task_file"

          task_id=$(python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["ok"] is True and data["task"]["operation"] == "local_ping"; print(data["task"]["request_id"])' "$task_file")
          result_body=$(python -c 'import json,sys; task_id=sys.argv[1]; print(json.dumps({"agent_action":"result","task_id":task_id,"response":{"contract_version":"relay-response-v1","request_id":task_id,"status":"success","result":{"status":"success","pong":True,"message":"relay server acceptance","project_id":"chat-agent-platform","executed_locally":True},"error":None}}, separators=(",",":")))' "$task_id")

          curl --fail --silent \
            -H "X-Agent-Token: $RELAY_AGENT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$result_body" \
            http://127.0.0.1:8787/ \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"] is True and data["duplicate"] is False'

          wait "$action_pid"
          python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["status"] == "success"; assert data["result"]["pong"] is True; assert data["result"]["executed_locally"] is True' "$action_file"
