name: ci

"on":
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-

      - name: Ensure pinned FFmpeg is available
        shell: pwsh
        run: |
          $current = $null
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            $current = (& ffmpeg -version | Select-Object -First 1)
          }
          if (-not $current -or $current -notmatch 'ffmpeg version 9\.0') {
            choco install ffmpeg --version=9.0.0 -y --no-progress --allow-downgrade
          }
          ffmpeg -version
          ffprobe -version

      - name: Install Python oracle
        shell: pwsh
        run: python -m pip install -e . --disable-pip-version-check

      - name: Verify Rust, contracts, Python oracle, parity, and release
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: agent-platform-windows-release
          path: target/release/agent-platform.exe
          if-no-files-found: error
