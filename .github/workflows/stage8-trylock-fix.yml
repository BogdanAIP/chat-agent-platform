name: stage8-trylock-fix

"on":
  push:
    branches: [chat/stage8-artifact-staging]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/stage8-artifact-staging
          fetch-depth: 0

      - name: Patch TryLockError handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/agent-platform/src/artifact.rs")
          content = path.read_text()
          old_pending = '''        Err(error) if error.kind() == ErrorKind::WouldBlock => Ok(PendingCleanup::Active),
                  Err(error) => Err(io_error("cannot probe pending artifact lock", error)),
          '''
          new_pending = '''        Err(std::fs::TryLockError::WouldBlock) => Ok(PendingCleanup::Active),
                  Err(std::fs::TryLockError::Error(error)) => {
                      Err(io_error("cannot probe pending artifact lock", error))
                  }
          '''
          old_orphan = '''        Err(error) if error.kind() == ErrorKind::WouldBlock => Ok(()),
                  Err(error) => Err(io_error("cannot probe orphan pending lock", error)),
          '''
          new_orphan = '''        Err(std::fs::TryLockError::WouldBlock) => Ok(()),
                  Err(std::fs::TryLockError::Error(error)) => {
                      Err(io_error("cannot probe orphan pending lock", error))
                  }
          '''
          if old_pending not in content or old_orphan not in content:
              raise SystemExit("Expected TryLockError patterns were not found")
          content = content.replace(old_pending, new_pending).replace(old_orphan, new_orphan)
          path.write_text(content)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/agent-platform/src/artifact.rs
          git commit -m 'Handle typed TryLockError variants'
          git push origin HEAD:chat/stage8-artifact-staging
