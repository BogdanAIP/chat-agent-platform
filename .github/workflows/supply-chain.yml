name: Supply Chain

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install checksum-pinned cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          version="0.20.2"
          archive="cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          expected_sha256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/$archive" "$url"
          echo "$expected_sha256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1
          chmod +x "$RUNNER_TEMP/cargo-deny/cargo-deny"
          "$RUNNER_TEMP/cargo-deny/cargo-deny" --version
      - name: Check dependency licenses, bans, and sources
        shell: bash
        run: |
          "$RUNNER_TEMP/cargo-deny/cargo-deny" \
            --log-level warn \
            --manifest-path ./Cargo.toml \
            --all-features \
            check licenses bans sources

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install checksum-pinned cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          version="0.20.2"
          archive="cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          expected_sha256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/$archive" "$url"
          echo "$expected_sha256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1
          chmod +x "$RUNNER_TEMP/cargo-deny/cargo-deny"
          "$RUNNER_TEMP/cargo-deny/cargo-deny" --version
      - name: Check RustSec advisories
        shell: bash
        run: |
          "$RUNNER_TEMP/cargo-deny/cargo-deny" \
            --log-level warn \
            --manifest-path ./Cargo.toml \
            --all-features \
            check advisories

  sbom:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Cache cargo-cyclonedx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: cargo-cyclonedx-0.5.9-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned cargo-cyclonedx
        shell: bash
        run: |
          if ! cargo cyclonedx --version 2>/dev/null | grep -q '0.5.9'; then
            cargo install --locked cargo-cyclonedx --version 0.5.9
          fi
      - name: Generate reproducible CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo cyclonedx \
            --manifest-path Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --target all \
            --all-features

          agent_sbom="$GITHUB_WORKSPACE/crates/agent-platform/agent-platform.cdx.json"
          relay_sbom="$GITHUB_WORKSPACE/crates/relay-server/relay-server.cdx.json"
          test -s "$agent_sbom"
          test -s "$relay_sbom"

          mkdir -p runtime/sbom
          cp "$agent_sbom" runtime/sbom/agent-platform.cdx.json
          cp "$relay_sbom" runtime/sbom/relay-server.cdx.json
          python -m json.tool runtime/sbom/agent-platform.cdx.json >/dev/null
          python -m json.tool runtime/sbom/relay-server.cdx.json >/dev/null
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-cyclonedx-sboms
          path: |
            runtime/sbom/agent-platform.cdx.json
            runtime/sbom/relay-server.cdx.json
          if-no-files-found: error
          retention-days: 30
