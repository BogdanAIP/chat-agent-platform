name: Stage 19 Matchering E2E

on:
  pull_request:
    paths:
      - "crates/agent-platform/src/reference_mastering.rs"
      - "crates/agent-platform/tests/stage19_reference_mastering.rs"
      - "crates/agent-platform/src/main.rs"
      - "scripts/matchering_adapter.py"
      - ".github/workflows/stage19-matchering.yml"
      - "config/tools.yaml"
      - "config/tool-lock.yaml"
      - "config/capability-requirements.yaml"
      - "config/policy.yaml"
  push:
    branches: [main]
    paths:
      - "crates/agent-platform/src/reference_mastering.rs"
      - "crates/agent-platform/tests/stage19_reference_mastering.rs"
      - "crates/agent-platform/src/main.rs"
      - "scripts/matchering_adapter.py"
      - ".github/workflows/stage19-matchering.yml"
      - "config/tools.yaml"
      - "config/tool-lock.yaml"
      - "config/capability-requirements.yaml"
      - "config/policy.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage19-matchering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matchering-e2e:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-
      - name: Ensure pinned FFmpeg is available
        shell: pwsh
        run: |
          $current = $null
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            $current = (& ffmpeg -version | Select-Object -First 1)
          }
          if (-not $current -or $current -notmatch 'ffmpeg version 9\.0') {
            choco install ffmpeg --version=9.0.0 -y --no-progress --allow-downgrade
          }
          ffmpeg -version
          ffprobe -version
      - name: Cache Matchering Python wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/pip/Cache
          key: matchering-2.0.6-py310-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Matchering edge runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install "matchering==2.0.6" --disable-pip-version-check
          python -m pip check
          python -m py_compile scripts/matchering_adapter.py
          $env:MATCHERING_PYTHON = (Get-Command python).Source
          python scripts/matchering_adapter.py probe
      - name: Run Stage 19 real E2E
        shell: pwsh
        run: |
          $env:MATCHERING_PYTHON = (Get-Command python).Source
          cargo test -p agent-platform --test stage19_reference_mastering -- --ignored --nocapture
