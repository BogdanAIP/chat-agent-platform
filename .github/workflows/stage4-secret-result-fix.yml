name: Stage 4 Secret Result Fix

on:
  push:
    branches: [chat/stage4-yandex-relay]
    paths:
      - ".github/workflows/stage4-secret-result-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/stage4-yandex-relay
      - name: Adapt poll result to SecretStore callback contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/agent-platform/src/transport/lifecycle.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        let polled = store.with_secret(secret_ref, &selection, |secret| {
              let token = std::str::from_utf8(secret)
                  .map_err(|_| PlatformError::SecretStore("relay token is not UTF-8".into()))?;
              validate_token(token)?;
              poll_once(&binding, &paths.cache, &paths.http, endpoint, token)
          });
          match polled {
              Ok(processed) => {
          '''
          new = '''        let mut processed = None;
          let polled = store.with_secret(secret_ref, &selection, |secret| {
              let token = std::str::from_utf8(secret)
                  .map_err(|_| PlatformError::SecretStore("relay token is not UTF-8".into()))?;
              validate_token(token)?;
              processed = poll_once(&binding, &paths.cache, &paths.http, endpoint, token)?;
              Ok(())
          });
          match polled {
              Ok(()) => {
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one poll callback block, got {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agent-platform/src/transport/lifecycle.rs
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Adapt relay poll result to SecretStore contract"
          git push origin HEAD:chat/stage4-yandex-relay
