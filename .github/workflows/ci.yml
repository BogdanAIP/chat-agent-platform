name: ci

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-

      - name: Ensure FFmpeg is available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version

      - name: Install Python oracle
        shell: pwsh
        run: python -m pip install -e . --disable-pip-version-check

      - name: Verify Rust, contracts, Python oracle, parity, and release
        shell: pwsh
        run: ./scripts/verify.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: agent-platform-windows-x64
          path: target/release/agent-platform.exe
          if-no-files-found: error

      - name: Persist generated Cargo.lock for Stage 7
        if: github.event_name == 'pull_request' && github.head_ref == 'chat/stage7-secret-store' && github.actor == 'BogdanAIP'
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git diff --quiet -- Cargo.lock
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cargo.lock is already committed"
            exit 0
          }
          $resolvedLock = Join-Path $env:RUNNER_TEMP "Cargo.lock"
          Copy-Item Cargo.lock $resolvedLock -Force
          git fetch origin "refs/heads/$env:HEAD_BRANCH:refs/remotes/origin/$env:HEAD_BRANCH"
          git checkout -B $env:HEAD_BRANCH "origin/$env:HEAD_BRANCH"
          Copy-Item $resolvedLock Cargo.lock -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update Cargo.lock for Stage 7"
          git push origin "HEAD:refs/heads/$env:HEAD_BRANCH"
