version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /runtime/semantic-projection
    schedule:
      interval: weekly
      day: sunday
      time: "04:40"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      semantic-npm-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "04:50"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      python-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
