name: Native Host v1

"on":
  pull_request:
    paths:
      - "runtime/native-host/**"
      - ".github/workflows/native-host-v1.yml"
      - "project-context/NATIVE_HOST_V1_RUST_REENTRY.md"
  workflow_dispatch:

concurrency:
  group: native-host-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/native-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw "rustup failed with exit code $LASTEXITCODE" }
          rustc +1.98.1 --version --verbose
          cargo +1.98.1 --version

      - name: Verify committed dependency lock
        shell: pwsh
        run: |
          cargo +1.98.1 metadata --locked --no-deps --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata --locked failed with exit code $LASTEXITCODE" }
          Get-Content Cargo.lock -Raw

      - name: Rust formatting
        shell: pwsh
        run: |
          cargo +1.98.1 fmt --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed with exit code $LASTEXITCODE" }

      - name: Rust tests
        shell: pwsh
        env:
          CAP_NATIVE_HOST_BUILD_ID: "github:${{ github.sha }}"
        run: |
          cargo +1.98.1 test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }

      - name: Rust clippy
        shell: pwsh
        env:
          CAP_NATIVE_HOST_BUILD_ID: "github:${{ github.sha }}"
        run: |
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed with exit code $LASTEXITCODE" }
