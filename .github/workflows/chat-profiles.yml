name: Chat Profile Acceptance

on:
  pull_request:
    paths:
      - "runtime/chat-profiles/**"
      - "runtime/1mcp-adaptive-shim/**"
      - "runtime/semantic-projection/**"
      - "scripts/start-chat-profile.ps1"
      - "scripts/start-semantic-profile.ps1"
      - "scripts/semantic-projection-runtime.ps1"
      - "scripts/status-chat-profile.ps1"
      - "scripts/stop-chat-profile.ps1"
      - "scripts/start-local-bridge.ps1"
      - "scripts/status-local-bridge.ps1"
      - "scripts/stop-local-bridge.ps1"
      - "scripts/chat-platform-controller.ps1"
      - "scripts/chat-platform.ps1"
      - "scripts/chat-platform-tray.ps1"
      - "scripts/bootstrap-chat-platform.ps1"
      - "tests/adaptive-mcp-acceptance.mjs"
      - "tests/test_adaptive_profile.py"
      - ".github/workflows/chat-profiles.yml"
      - "project-context/STAGE24_LEAST_PRIVILEGE.md"
  push:
    branches: [main]
    paths:
      - "runtime/chat-profiles/**"
      - "runtime/1mcp-adaptive-shim/**"
      - "runtime/semantic-projection/**"
      - "scripts/start-chat-profile.ps1"
      - "scripts/start-semantic-profile.ps1"
      - "scripts/semantic-projection-runtime.ps1"
      - "scripts/status-chat-profile.ps1"
      - "scripts/stop-chat-profile.ps1"
      - "scripts/start-local-bridge.ps1"
      - "scripts/status-local-bridge.ps1"
      - "scripts/stop-local-bridge.ps1"
      - "scripts/chat-platform-controller.ps1"
      - "scripts/chat-platform.ps1"
      - "scripts/chat-platform-tray.ps1"
      - "scripts/bootstrap-chat-platform.ps1"
      - "tests/adaptive-mcp-acceptance.mjs"
      - "tests/test_adaptive_profile.py"
      - ".github/workflows/chat-profiles.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-profiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-profiles:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Environment
        shell: pwsh
        run: |
          node --version
          npx --version
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) { throw 'Google Chrome is required for browser acceptance.' }
          $env:PATH = "$(Split-Path $chrome -Parent);$env:PATH"

      - name: Parse profile lifecycle scripts
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/start-local-bridge.ps1',
            'scripts/status-local-bridge.ps1',
            'scripts/stop-local-bridge.ps1',
            'scripts/start-chat-profile.ps1',
            'scripts/start-semantic-profile.ps1',
            'scripts/semantic-projection-runtime.ps1',
            'scripts/status-chat-profile.ps1',
            'scripts/stop-chat-profile.ps1',
            'scripts/chat-platform-controller.ps1',
            'scripts/chat-platform.ps1',
            'scripts/chat-platform-tray.ps1',
            'scripts/bootstrap-chat-platform.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$script has PowerShell syntax errors: $($errors -join '; ')" }
          }

      - name: Enforce pinned direct profiles, semantic projection, and adaptive catalog
        shell: pwsh
        run: |
          $files = Get-Content 'runtime/chat-profiles/files-readonly/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $browser = Get-Content 'runtime/chat-profiles/browser-isolated/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $semantic = Get-Content 'runtime/chat-profiles/semantic/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $adaptive = Get-Content 'runtime/chat-profiles/adaptive/mcp.json' -Raw -Encoding utf8 | ConvertFrom-Json

          $fileServers = @($files.mcpServers.PSObject.Properties)
          $browserServers = @($browser.mcpServers.PSObject.Properties)
          $semanticServers = @($semantic.mcpServers.PSObject.Properties)
          $adaptiveServers = @($adaptive.mcpServers.PSObject.Properties)
          if ($fileServers.Count -ne 1 -or $fileServers[0].Name -ne 'filesystem') { throw 'Files profile must contain only filesystem.' }
          if ($browserServers.Count -ne 1 -or $browserServers[0].Name -ne 'playwright') { throw 'Browser profile must contain only playwright.' }
          if ($semanticServers.Count -ne 1 -or $semanticServers[0].Name -ne 'semantic-projection') { throw 'Semantic profile must contain only semantic-projection.' }
          if ([string]$semantic.mcpServers.'semantic-projection'.command -ne 'node') { throw 'Semantic profile must directly launch Node.' }
          if (@($semantic.mcpServers.'semantic-projection'.args).Count -ne 1 -or [string]$semantic.mcpServers.'semantic-projection'.args[0] -ne '${CHAT_SEMANTIC_PROJECTION_ENTRY}') { throw 'Semantic entrypoint contract drifted.' }
          if ($adaptiveServers.Count -ne 2) { throw 'Adaptive catalog must contain exactly filesystem and playwright for this acceptance stage.' }
          foreach ($name in @('filesystem','playwright')) {
            $entry = @($adaptiveServers | Where-Object Name -eq $name)
            if ($entry.Count -ne 1) { throw "Adaptive catalog is missing $name." }
            if (-not [bool]$entry[0].Value.disabled) { throw "Adaptive backend $name must start disabled." }
          }

          $fileRaw = Get-Content 'runtime/chat-profiles/files-readonly/mcp.json' -Raw -Encoding utf8
          $browserRaw = Get-Content 'runtime/chat-profiles/browser-isolated/mcp.json' -Raw -Encoding utf8
          $semanticRaw = Get-Content 'runtime/chat-profiles/semantic/mcp.json' -Raw -Encoding utf8
          $adaptiveRaw = Get-Content 'runtime/chat-profiles/adaptive/mcp.json' -Raw -Encoding utf8
          foreach ($raw in @($fileRaw,$adaptiveRaw)) {
            if ($raw -notmatch [regex]::Escape('@modelcontextprotocol/server-filesystem@2026.7.10')) { throw 'Filesystem pin drifted.' }
          }
          foreach ($raw in @($browserRaw,$adaptiveRaw)) {
            if ($raw -notmatch [regex]::Escape('@playwright/mcp@0.0.78')) { throw 'Playwright pin drifted.' }
          }
          foreach ($tool in @('create_directory','write_file','edit_file','move_file')) {
            if (@($files.mcpServers.filesystem.disabledTools) -notcontains $tool) { throw "Files profile must disable $tool." }
            if (@($adaptive.mcpServers.filesystem.disabledTools) -notcontains $tool) { throw "Adaptive filesystem must disable $tool." }
          }
          foreach ($tool in @('browser_run_code_unsafe','browser_evaluate','browser_file_upload','browser_network_request')) {
            if (@($browser.mcpServers.playwright.disabledTools) -notcontains $tool) { throw "Browser profile must disable $tool." }
            if (@($adaptive.mcpServers.playwright.disabledTools) -notcontains $tool) { throw "Adaptive Playwright must disable $tool." }
          }
          if ($fileRaw -match '@playwright/mcp|browser_') { throw 'Direct files profile contains browser capability.' }
          if ($browserRaw -match 'server-filesystem|CHAT_LOCAL_FILES_ROOT') { throw 'Direct browser profile contains filesystem capability.' }
          foreach ($forbidden in @('api_key','subscription','browserbase','apify','firecrawl')) {
            if (($fileRaw + $browserRaw + $semanticRaw + $adaptiveRaw).ToLowerInvariant() -match $forbidden) { throw "Unexpected paid/cloud dependency marker: $forbidden" }
          }

      - name: Prove profile stop is idempotent
        shell: pwsh
        run: |
          ./scripts/stop-chat-profile.ps1
          ./scripts/stop-chat-profile.ps1
          ./scripts/stop-local-bridge.ps1
          ./scripts/stop-local-bridge.ps1

      - name: Prove direct profile switching and isolation
        shell: pwsh
        run: |
          $filesRoot = Join-Path $env:RUNNER_TEMP 'chat-profile-files'
          New-Item -ItemType Directory -Force -Path $filesRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $filesRoot 'marker.txt') -Value 'CHAT_PROFILE_FILES_OK' -Encoding utf8
          try {
            ./scripts/start-chat-profile.ps1 -Profile files-readonly -FilesRoot $filesRoot -Port 3066 -ReadyTimeoutSeconds 240
            $filesStatus = ./scripts/status-chat-profile.ps1 -Port 3066 | Out-String | ConvertFrom-Json
            if ($filesStatus.active_count -ne 1 -or $filesStatus.active_profile -ne 'files-readonly' -or $filesStatus.conflict) { throw 'files-readonly was not the only active profile.' }

            ./scripts/start-chat-profile.ps1 -Profile browser-isolated -Port 3066 -ReadyTimeoutSeconds 240
            $browserStatus = ./scripts/status-chat-profile.ps1 -Port 3066 | Out-String | ConvertFrom-Json
            if ($browserStatus.active_count -ne 1 -or $browserStatus.active_profile -ne 'browser-isolated' -or $browserStatus.conflict) { throw 'browser-isolated did not replace files-readonly.' }
          }
          finally {
            ./scripts/stop-chat-profile.ps1
          }

      - name: Prove semantic profile is understood by the public manager
        shell: pwsh
        run: |
          $filesRoot = Join-Path $env:RUNNER_TEMP 'chat-semantic-manager-files'
          New-Item -ItemType Directory -Force -Path $filesRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $filesRoot 'input.txt') -Value 'SEMANTIC_MANAGER_OK' -Encoding utf8

          try {
            ./scripts/chat-platform.ps1 -Action SetProfile -Profile semantic -FilesRoot $filesRoot -NoNotify
            ./scripts/start-semantic-profile.ps1 -FilesRoot $filesRoot -Port 3050 -ReadyTimeoutSeconds 120

            $managerStatus = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
            if (-not $managerStatus.mcp_ready -or [string]$managerStatus.active_profile -ne 'semantic' -or [int]$managerStatus.active_count -ne 1 -or $managerStatus.conflict) { throw 'Public manager did not recognize the ready semantic profile.' }
            if ($managerStatus.tunnel_running -or $managerStatus.tunnel_ready) { throw 'Hosted semantic manager acceptance unexpectedly found a tunnel.' }
            if ([string]$managerStatus.settings.profile -ne 'semantic') { throw 'Public manager did not persist semantic as the selected profile.' }
            if ([System.IO.Path]::GetFullPath([string]$managerStatus.settings.files_root) -ne [System.IO.Path]::GetFullPath($filesRoot)) { throw 'Public manager did not persist the semantic FilesRoot.' }

            ./scripts/chat-platform.ps1 -Action Toggle -NoNotify
            $stopped = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
            if ([int]$stopped.active_count -ne 0 -or $stopped.tunnel_running) { throw 'Public manager toggle did not stop the semantic Runtime Scope.' }

            ./scripts/chat-platform.ps1 -Action SetProfile -Profile reference -NoNotify
            $reset = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
            if ([string]$reset.settings.profile -ne 'reference') { throw 'Public manager did not restore the safe reference default after semantic acceptance.' }

            Write-Host 'SEMANTIC_PUBLIC_MANAGER=PASS'
          }
          finally {
            ./scripts/stop-chat-profile.ps1
          }

      - name: Prove public manager can observe and clean conflicting runtime scopes
        shell: pwsh
        run: |
          $filesRoot = Join-Path $env:RUNNER_TEMP 'chat-profile-conflict-files'
          New-Item -ItemType Directory -Force -Path $filesRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $filesRoot 'marker.txt') -Value 'CHAT_PROFILE_CONFLICT_OK' -Encoding utf8
          $env:CHAT_LOCAL_FILES_ROOT = $filesRoot
          try {
            ./scripts/start-local-bridge.ps1 -Port 3071 -ConfigPath runtime/chat-profiles/files-readonly/mcp.json -HealthServerName filesystem -ReadyTimeoutSeconds 240
            ./scripts/start-local-bridge.ps1 -Port 3072 -ConfigPath runtime/chat-profiles/browser-isolated/mcp.json -HealthServerName playwright -ReadyTimeoutSeconds 240
            $conflict = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
            if ($conflict.active_count -ne 2 -or -not $conflict.conflict) { throw 'Manager did not preserve active_count=2 conflict state.' }
            ./scripts/chat-platform.ps1 -Action Toggle -NoNotify
            $clean = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
            if ($clean.active_count -ne 0 -or $clean.conflict) { throw 'Manager did not clean conflicting Runtime Scopes.' }
          }
          finally {
            Remove-Item Env:CHAT_LOCAL_FILES_ROOT -ErrorAction SilentlyContinue
            ./scripts/stop-chat-profile.ps1
          }

  adaptive-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Adaptive environment
        shell: pwsh
        run: |
          node --version
          npx --version
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) { throw 'Google Chrome is required for adaptive browser acceptance.' }
          $env:PATH = "$(Split-Path $chrome -Parent);$env:PATH"

      - name: Prove adaptive lazy runtime can activate backends on demand
        shell: pwsh
        run: |
          $port = 3050
          $filesRoot = Join-Path $env:RUNNER_TEMP 'chat-adaptive-files'
          $marker = Join-Path $filesRoot 'marker.txt'
          $adaptiveConfig = 'runtime/chat-profiles/adaptive/mcp.json'
          $adaptiveConfigBackup = Join-Path $env:RUNNER_TEMP 'adaptive-mcp.original.json'
          New-Item -ItemType Directory -Force -Path $filesRoot | Out-Null
          Set-Content -LiteralPath $marker -Value 'CHAT_ADAPTIVE_FILES_OK' -Encoding utf8
          Copy-Item -LiteralPath $adaptiveConfig -Destination $adaptiveConfigBackup

          try {
            ./scripts/chat-platform.ps1 -Action SetProfile -Profile adaptive -FilesRoot $filesRoot -NoNotify
            ./scripts/start-chat-profile.ps1 -Profile adaptive -FilesRoot $filesRoot -Port $port -ReadyTimeoutSeconds 240
            $adaptiveStatus = ./scripts/status-chat-profile.ps1 -Port $port | Out-String | ConvertFrom-Json
            if ($adaptiveStatus.active_count -ne 1 -or $adaptiveStatus.active_profile -ne 'adaptive' -or $adaptiveStatus.conflict) { throw 'adaptive was not the only active profile.' }

            $managerStatus = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
            if (-not $managerStatus.mcp_ready -or $managerStatus.active_profile -ne 'adaptive' -or $managerStatus.active_count -ne 1 -or $managerStatus.conflict) { throw 'Public manager did not recognize the ready adaptive profile.' }
            if ($managerStatus.tunnel_running -or $managerStatus.tunnel_ready) { throw 'Hosted adaptive acceptance unexpectedly found a tunnel.' }
            if ([string]$managerStatus.settings.profile -ne 'adaptive') { throw 'Public manager did not persist adaptive as the selected profile.' }
            if ([System.IO.Path]::GetFullPath([string]$managerStatus.settings.files_root) -ne [System.IO.Path]::GetFullPath($filesRoot)) { throw 'Public manager did not persist the adaptive FilesRoot.' }

            $acceptance = node tests/adaptive-mcp-acceptance.mjs "http://127.0.0.1:$port/mcp" $marker 2>&1 | Out-String
            Write-Host $acceptance
            if ($LASTEXITCODE -ne 0) { throw "Adaptive MCP session acceptance failed: $acceptance" }
            if ($acceptance -notmatch 'ADAPTIVE_MCP_ACCEPTANCE=passed') { throw "Adaptive MCP session acceptance did not report success: $acceptance" }

            $backendProcesses = @(Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq 'node.exe' -and (
                $_.CommandLine -like '*server-filesystem*' -or
                $_.CommandLine -like '*playwright*mcp*'
              )
            })
            if ($backendProcesses.Count -ne 0) {
              $details = $backendProcesses | Select-Object ProcessId,ParentProcessId,CommandLine | Out-String
              throw "Adaptive backend process remained after disable: $details"
            }

            ./scripts/chat-platform.ps1 -Action Toggle -NoNotify
            $stopped = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
            if ($stopped.active_count -ne 0 -or $stopped.tunnel_running) { throw 'Public manager toggle did not stop the adaptive Runtime Scope.' }
            ./scripts/chat-platform.ps1 -Action SetProfile -Profile reference -NoNotify
            $reset = ./scripts/chat-platform.ps1 -Action Status -NoNotify | Out-String | ConvertFrom-Json
            if ([string]$reset.settings.profile -ne 'reference') { throw 'Public manager did not restore the safe reference default after adaptive acceptance.' }
          }
          finally {
            try {
              ./scripts/stop-chat-profile.ps1
            }
            finally {
              Copy-Item -LiteralPath $adaptiveConfigBackup -Destination $adaptiveConfig -Force
            }
          }
