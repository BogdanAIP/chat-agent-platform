{
  "contract_version": "policy-v1",
  "rules": {
    "media.inspect": {
      "decision": "allow",
      "enforced_by": "local_media_adapter",
      "allowed_data_classes": ["public", "project", "private", "sensitive"],
      "external_side_effect": false,
      "max_cost": 0
    },
    "runtime.self_test": {
      "decision": "allow",
      "enforced_by": "rust_local_core",
      "allowed_data_classes": ["project"],
      "external_side_effect": false,
      "max_cost": 0
    },
    "shell.run_arbitrary": {
      "decision": "deny",
      "enforced_by": "policy_enforcement_point"
    }
  }
}
