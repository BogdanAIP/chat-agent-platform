name: Media Clippy Fix

on:
  push:
    branches: [chat/media-runtime-hardening]
    paths:
      - ".github/workflows/media-clippy-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/media-runtime-hardening
      - name: Apply Clippy-preferred Duration units
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/agent-platform/src/media.rs')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'Duration::from_secs(60)': 'Duration::from_mins(1)',
              'Duration::from_secs(6 * 60 * 60)': 'Duration::from_hours(6)',
              'Duration::from_secs(120)': 'Duration::from_mins(2)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old}, got {count}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
      - name: Format and commit
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agent-platform/src/media.rs
          git commit -m "Use Clippy-preferred media timeout units"
          git push origin HEAD:chat/media-runtime-hardening
