name: P1 Compatibility Fix

on:
  push:
    branches: [chat/config-profile-docs-hardening]
    paths:
      - ".github/workflows/p1-compat-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/config-profile-docs-hardening
      - name: Align isolated fixture and preserve rust field
        shell: python
        run: |
          from pathlib import Path

          fixture = Path("crates/agent-platform/tests/stage19_reference_mastering.rs")
          text = fixture.read_text(encoding="utf-8")
          needle = '"executor": "edge.python.matchering",'
          if text.count(needle) != 1:
              raise SystemExit(f"stage19 fixture: expected one executor line, got {text.count(needle)}")
          lines = text.splitlines()
          output = []
          inserted = False
          for line in lines:
              output.append(line)
              if needle in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  output.append(f'{indent}"execution_path": "edge.python.matchering",')
                  inserted = True
          if not inserted:
              raise SystemExit("stage19 fixture execution_path was not inserted")
          fixture.write_text("\n".join(output) + "\n", encoding="utf-8")

          service = Path("crates/agent-platform/src/service.rs")
          text = service.read_text(encoding="utf-8")
          marker = '        "rust_minimum": env!("CARGO_PKG_RUST_VERSION"),\n'
          count = text.count(marker)
          if count != 2:
              raise SystemExit(f"service.rs: expected two rust_minimum markers, got {count}")
          text = text.replace(
              marker,
              '        "rust": env!("CARGO_PKG_RUST_VERSION"),\n' + marker,
          )
          service.write_text(text, encoding="utf-8")
      - name: Commit compatibility patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agent-platform/src/service.rs crates/agent-platform/tests/stage19_reference_mastering.rs
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Preserve runtime profile compatibility"
          git push origin HEAD:chat/config-profile-docs-hardening
