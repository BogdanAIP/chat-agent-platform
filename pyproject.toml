[project]
name = "chat-agent-platform"
version = "0.2.0"
description = "Rust-first local execution core for the chat-centric agent platform"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5"]

[tool.setuptools]
packages = ["agent_platform"]

[tool.setuptools.data-files]
contracts = ["contracts/*.schema.json"]
