[package]
name = "agent-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
atomic-write-file = "0.3.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap.workspace = true
jsonschema = { version = "0.49.6", default-features = false }
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
tokio = { version = "~1.51.4", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid.workspace = true
wait-timeout = "0.2.1"
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.0"
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
